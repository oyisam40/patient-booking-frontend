{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCONNECT - Doctors &amp; Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1B9AAA;
            min-height: 100vh;
        }
        .app-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1050;
        }
        .sidebar-toggle {
            background: none;
            border: none;
            font-size: 22px;
            color: #1B9AAA;
            cursor: pointer;
            padding: 4px 10px;
            margin-right: 12px;
        }
        .app-logo {
            font-weight: 700;
            color: #1B9AAA;
            font-size: 18px;
            margin-right: 20px;
        }
        .app-page-title {
            font-size: 16px;
            color: #555;
            font-weight: 600;
        }
        .app-sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 240px;
            height: calc(100vh - 60px);
            background: #fff;
            box-shadow: 2px 0 8px rgba(0,0,0,0.08);
            z-index: 1040;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .sidebar-links {
            padding: 20px 0;
        }
        .sidebar-link {
            display: block;
            padding: 12px 24px;
            color: #555;
            text-decoration: none;
            font-size: 15px;
            border-left: 3px solid transparent;
        }
        .sidebar-link:hover {
            background: #f4f7f8;
            color: #1B9AAA;
        }
        .sidebar-link.active {
            background: #eafaf9;
            color: #1B9AAA;
            border-left-color: #1B9AAA;
            font-weight: 600;
        }
        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid #eee;
        }
        .sidebar-logout {
            background: none;
            border: none;
            color: #c0392b;
            font-size: 15px;
            cursor: pointer;
            padding: 0;
        }
        .sidebar-logout:hover {
            color: #a93226;
            text-decoration: underline;
        }
        .app-content {
            margin-left: 240px;
            margin-top: 60px;
            padding: 40px 20px;
            transition: margin-left 0.3s ease;
        }
        body.sidebar-collapsed .app-sidebar {
            transform: translateX(-100%);
        }
        body.sidebar-collapsed .app-content {
            margin-left: 0;
        }

        .page-card {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .page-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .clinic-name-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .member-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .member-tab {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #ddd;
            background: #fff;
            color: #555;
            cursor: pointer;
            font-size: 14px;
        }

        .member-tab.active {
            background-color: #1B9AAA;
            border-color: #1B9AAA;
            color: #fff;
        }

        .member-tab-count {
            margin-left: 6px;
            opacity: 0.8;
            font-size: 12px;
        }

        .member-row {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 16px 22px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .member-row:last-child {
            margin-bottom: 0;
        }

        .member-name {
            font-weight: 700;
            font-size: 16px;
        }

        .member-meta {
            font-size: 13px;
            color: #888;
            margin-top: 2px;
        }

        .member-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .member-status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .member-status-badge.active {
            background-color: #d4edda;
            color: #155724;
        }

        .member-status-badge.inactive {
            background-color: #f8d7da;
            color: #721c24;
        }

        .btn-teal {
            background-color: #1B9AAA;
            border-color: #1B9AAA;
            color: white;
        }
        .btn-teal:hover {
            background-color: #16808f;
            border-color: #16808f;
            color: white;
        }

        .modal-backdrop-custom {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1050;
            align-items: flex-start;
            justify-content: center;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .modal-backdrop-custom.open {
            display: flex;
        }

        .add-modal {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.2);
        }

        .empty-state,
        .loading-state {
            text-align: center;
            color: #999;
            padding: 30px 0;
        }
    </style>
    <script src="{% static 'js/guard.js' %}"></script>
    <script src="{% static 'js/config.js' %}"></script>
    <script src="{% static 'js/clinic_context.js' %}"></script>
</head>
<body>

    <header class="app-topbar">
        <button type="button" class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
        <span class="app-logo">DOCONNECT</span>
        <span class="app-page-title">Doctors &amp; Staff</span>
    </header>

    <nav class="app-sidebar" id="appSidebar">
        <div class="sidebar-links">
            <a href="{% url 'clinic_dashboard' %}" class="sidebar-link">Dashboard</a>
            <a href="{% url 'clinic_doctors_staff' %}" class="sidebar-link active">Doctors &amp; Staff</a>
            <a href="{% url 'clinic_calendar' %}" class="sidebar-link">Calendar</a>
            <a href="{% url 'clinic_appointments' %}" class="sidebar-link">Appointments</a>
            <a href="{% url 'clinic_reports' %}" class="sidebar-link">Reports</a>
            <a href="{% url 'clinic_settings' %}" class="sidebar-link">Clinic Settings</a>
            <a href="{% url 'notifications' %}" class="sidebar-link">Notifications</a>
        </div>
        <div class="sidebar-footer">
            <button type="button" class="sidebar-logout" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="app-content">
        <div class="page-card">
            <div class="page-header-row">
                <h1 class="h3 mb-0 font-weight-normal">Doctors &amp; Staff</h1>
                <button type="button" class="btn btn-teal" id="openAddModalBtn">+ Add Doctor</button>
            </div>
            <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
                <div class="clinic-name-label mb-0" id="clinicNameLabel"></div>
                <select id="clinicSelect" class="form-select form-select-sm" style="max-width:260px;display:none;" aria-label="Clinic"></select>
            </div>

            <div class="member-tabs">
                <button type="button" class="member-tab active" id="tabDoctors">
                    Doctors<span class="member-tab-count" id="doctorsTabCount">0</span>
                </button>
                <button type="button" class="member-tab" id="tabStaff">
                    Administrators<span class="member-tab-count" id="staffTabCount">0</span>
                </button>
            </div>

            <div class="loading-state" id="loadingState">Loading...</div>
            <div class="empty-state" id="emptyState" style="display:none;"></div>
            <div id="memberList"></div>
        </div>
    </div>

    <div class="modal-backdrop-custom" id="addModalBackdrop">
        <div class="add-modal">
            <h5 class="mb-3" id="addModalTitle">Add Doctor</h5>

            <div class="mb-3">
                <label class="form-label">User ID</label>
                <input type="number" min="1" id="addUserId" class="form-control" placeholder="The person's user id">
                <div class="form-text">The person must already have a DOCONNECT account.</div>
            </div>

            <div id="addError" class="text-danger mb-3" style="display:none;"></div>

            <div class="d-flex gap-2 mt-3">
                <button type="button" class="btn btn-outline-secondary w-100" id="addModalDismiss">Cancel</button>
                <button type="button" class="btn btn-teal w-100" id="addModalConfirm">Add</button>
            </div>
        </div>
    </div>

<script>
    const token = localStorage.getItem('accessToken');

    document.getElementById('sidebarToggle').addEventListener('click', function () {
        document.body.classList.toggle('sidebar-collapsed');
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('refreshToken');
        window.location.href = "{% url 'home' %}";
    });

    // Real endpoints (Ntsako):
    //   GET   /api/clinics/{id}/members/  -> { count, members: [{ id, clinic, clinic_name,
    //                                          user_name, user_email, role, is_active, joined_at }] }
    //   POST  /api/clinics/{id}/members/  { user: <user id>, role: 'DOCTOR' | 'ADMIN' }
    //   PATCH /api/clinics/{id}/members/{memberId}/  { is_active: true | false }
    // Membership roles are PATIENT, DOCTOR and ADMIN (there is no STAFF role), so the
    // second tab lists clinic administrators. Patients are not shown here.

    let activeTab = 'doctors';
    let currentClinicId = null;
    let members = [];

    function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
    }

    async function api(method, path, body) {
        const response = await fetch(`${API_BASE_URL}${path}`, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: body ? JSON.stringify(body) : undefined
        });
        const data = await response.json().catch(() => null);
        return { ok: response.ok, status: response.status, data: data };
    }

    function flattenErrors(data) {
        if (!data) return '';
        if (typeof data === 'string') return data;
        if (Array.isArray(data)) return data.map(flattenErrors).join(' ');
        if (data.detail) return String(data.detail);
        return Object.keys(data).map(k => {
            const v = flattenErrors(data[k]);
            return k === 'non_field_errors' ? v : `${k}: ${v}`;
        }).join(' ');
    }

    function describeError(status, data) {
        if (status === 401) return 'You are not logged in. Please log in again.';
        if (status === 403) return "You don't have permission to manage this clinic's members.";
        return flattenErrors(data) || `Request failed (HTTP ${status}).`;
    }

    function showLoadMessage(message) {
        document.getElementById('memberList').innerHTML = '';
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('loadingState').textContent = message;
        document.getElementById('loadingState').style.display = 'block';
    }

    function clinicListError(reason) {
        if (reason === 401) return showLoadMessage('You are not logged in. Please log in again.');
        if (reason === 403) return showLoadMessage("You don't have access to any clinic.");
        if (reason === 'none') return showLoadMessage('No clinics found.');
        if (reason === 0) return showLoadMessage('Could not reach the server. Please try again later.');
        showLoadMessage(`Could not load clinics (HTTP ${reason}).`);
    }

    // =========================================================
    // LOAD
    // =========================================================

    async function loadData(clinicId, clinic) {
        currentClinicId = clinicId;
        members = [];
        document.getElementById('clinicNameLabel').textContent = clinic && clinic.name ? clinic.name : '';
        showLoadMessage('Loading...');
        renderCounts();

        let result;
        try {
            result = await api('GET', `/api/clinics/${clinicId}/members/`);
        } catch (error) {
            console.error(error);
            if (String(currentClinicId) === String(clinicId)) {
                showLoadMessage('Could not reach the server. Please try again later.');
            }
            return;
        }

        if (String(currentClinicId) !== String(clinicId)) return; // switched clinic meanwhile

        if (!result.ok) {
            showLoadMessage(describeError(result.status, result.data));
            return;
        }

        const list = (result.data && (result.data.members || result.data.results)) || result.data;
        members = Array.isArray(list) ? list : [];

        document.getElementById('loadingState').style.display = 'none';
        renderAll();
    }

    // =========================================================
    // RENDER
    // =========================================================

    function roleForTab() { return activeTab === 'doctors' ? 'DOCTOR' : 'ADMIN'; }

    function membersForRole(role) {
        return members.filter(m => String(m.role).toUpperCase() === role);
    }

    function renderCounts() {
        document.getElementById('doctorsTabCount').textContent = membersForRole('DOCTOR').length;
        document.getElementById('staffTabCount').textContent = membersForRole('ADMIN').length;
    }

    function renderAll() {
        renderCounts();
        document.getElementById('openAddModalBtn').textContent =
            activeTab === 'doctors' ? '+ Add Doctor' : '+ Add Administrator';
        renderList();
    }

    function renderList() {
        const container = document.getElementById('memberList');
        const emptyState = document.getElementById('emptyState');
        const rows = membersForRole(roleForTab());

        if (rows.length === 0) {
            container.innerHTML = '';
            emptyState.textContent = activeTab === 'doctors' ? 'No doctors added yet.' : 'No administrators added yet.';
            emptyState.style.display = 'block';
            return;
        }

        emptyState.style.display = 'none';
        container.innerHTML = rows.map(memberRowHtml).join('');

        container.querySelectorAll('.toggle-status-btn').forEach(btn => {
            btn.addEventListener('click', () => toggleStatus(btn.getAttribute('data-id'), btn));
        });
    }

    function formatJoined(value) {
        if (!value) return '';
        const d = new Date(value);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function memberRowHtml(member) {
        const isDoctor = String(member.role).toUpperCase() === 'DOCTOR';
        const isActive = member.is_active !== false;
        const status = isActive ? 'ACTIVE' : 'INACTIVE';
        const joined = formatJoined(member.joined_at);

        return `
            <div class="member-row">
                <div>
                    <div class="member-name">${isDoctor ? 'Dr. ' : ''}${escapeHtml(member.user_name)}</div>
                    <div class="member-meta">${escapeHtml(member.user_email)}</div>
                    ${joined ? `<div class="member-meta">Joined ${escapeHtml(joined)}</div>` : ''}
                </div>
                <div class="member-actions">
                    <span class="member-status-badge ${status.toLowerCase()}">${status}</span>
                    <button type="button"
                            class="btn btn-sm ${isActive ? 'btn-outline-danger' : 'btn-outline-secondary'} toggle-status-btn"
                            data-id="${escapeHtml(member.id)}">
                        ${isActive ? 'Deactivate' : 'Reactivate'}
                    </button>
                </div>
            </div>
        `;
    }

    // =========================================================
    // TABS
    // =========================================================

    function setActiveTab(tab) {
        activeTab = tab;
        document.getElementById('tabDoctors').classList.toggle('active', tab === 'doctors');
        document.getElementById('tabStaff').classList.toggle('active', tab === 'staff');
        renderAll();
    }

    document.getElementById('tabDoctors').addEventListener('click', () => setActiveTab('doctors'));
    document.getElementById('tabStaff').addEventListener('click', () => setActiveTab('staff'));

    // =========================================================
    // ACTIVATE / DEACTIVATE
    // =========================================================

    async function toggleStatus(id, button) {
        const member = members.find(m => String(m.id) === String(id));
        if (!member) return;

        const deactivating = member.is_active !== false;
        const message = deactivating
            ? `Deactivate ${member.user_name}? They will no longer be available in this clinic.`
            : `Reactivate ${member.user_name}?`;

        if (!confirm(message)) return;

        const clinicId = currentClinicId;
        button.disabled = true;

        let result;
        try {
            result = await api('PATCH', `/api/clinics/${clinicId}/members/${member.id}/`,
                { is_active: !deactivating });
        } catch (error) {
            console.error(error);
            button.disabled = false;
            alert('Could not reach the server. Please try again.');
            return;
        }

        if (String(currentClinicId) !== String(clinicId)) return;

        if (!result.ok) {
            button.disabled = false;
            alert(describeError(result.status, result.data));
            return;
        }

        // Use the server's answer when it sends the member back.
        const updated = result.data && typeof result.data.is_active === 'boolean'
            ? result.data : { is_active: !deactivating };
        member.is_active = updated.is_active;
        renderAll();
    }

    // =========================================================
    // ADD DOCTOR / ADMINISTRATOR
    // =========================================================

    function openAddModal() {
        document.getElementById('addModalTitle').textContent =
            activeTab === 'doctors' ? 'Add Doctor' : 'Add Administrator';
        document.getElementById('addModalBackdrop').classList.add('open');
    }

    function closeAddModal() {
        document.getElementById('addModalBackdrop').classList.remove('open');
        document.getElementById('addError').style.display = 'none';
        document.getElementById('addUserId').value = '';
        document.getElementById('addModalConfirm').disabled = false;
    }

    document.getElementById('openAddModalBtn').addEventListener('click', openAddModal);
    document.getElementById('addModalDismiss').addEventListener('click', closeAddModal);

    document.getElementById('addModalConfirm').addEventListener('click', async function () {
        const errorBox = document.getElementById('addError');
        const confirmBtn = document.getElementById('addModalConfirm');
        errorBox.style.display = 'none';

        const userId = parseInt(document.getElementById('addUserId').value, 10);
        if (!userId || userId < 1) {
            errorBox.textContent = 'Please enter the user id of an existing account.';
            errorBox.style.display = 'block';
            return;
        }

        const clinicId = currentClinicId;
        if (clinicId === null) return;
        const role = roleForTab();
        confirmBtn.disabled = true;

        let result;
        try {
            result = await api('POST', `/api/clinics/${clinicId}/members/`, { user: userId, role: role });
        } catch (error) {
            console.error(error);
            errorBox.textContent = 'Network error: could not add this person.';
            errorBox.style.display = 'block';
            confirmBtn.disabled = false;
            return;
        }

        if (!result.ok) {
            errorBox.textContent = describeError(result.status, result.data);
            errorBox.style.display = 'block';
            confirmBtn.disabled = false;
            return;
        }

        closeAddModal();
        // Reload so the list shows exactly what the server stored (name, email, joined date).
        if (String(currentClinicId) === String(clinicId)) {
            await loadData(clinicId, { name: document.getElementById('clinicNameLabel').textContent });
        }
    });

    ClinicContext.init({
        selectId: 'clinicSelect',
        onSelect: loadData,
        onError: clinicListError
    });
</script>
</body>
</html>
