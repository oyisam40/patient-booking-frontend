{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Careers - DOCONNECT</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.bg{animation:slide 3s ease-in-out infinite alternate;background-image:linear-gradient(-60deg,#1B9AAA 50%,#4FD1C5 50%);bottom:0;left:-50%;opacity:.5;position:fixed;right:-50%;top:0;z-index:-1}
.bg2{animation-direction:alternate-reverse;animation-duration:4s}.bg3{animation-duration:5s}
@keyframes slide{0%{transform:translateX(-25%)}100%{transform:translateX(25%)}}
body{min-height:100vh}
.btn-teal{background:#1B9AAA;border-color:#1B9AAA;color:#fff}.btn-teal:hover:not(:disabled){background:#16808f;border-color:#16808f;color:#fff}.btn-teal:disabled{background:#1B9AAA;color:#fff;opacity:.6}
.teal-link{color:#1B9AAA;text-decoration:none}.teal-link:hover{text-decoration:underline}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#1B9AAA}
.section-title{font-size:14px;font-weight:700;color:#1B9AAA;text-transform:uppercase;letter-spacing:.03em;margin:20px 0 10px}
.err{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;border-radius:8px;padding:12px 16px;font-size:14px;margin-bottom:16px}
.ok{background:#d4edda;color:#155724;border:1px solid #c3e6cb;border-radius:8px;padding:12px 16px;font-size:14px;margin-bottom:16px}
.panel{display:none}.panel.active{display:block}
.vac{border:1px solid #dee2e6;border-radius:10px;padding:14px 16px;margin-bottom:12px;cursor:pointer;background:#fff}
.vac:hover{border-color:#1B9AAA}
.badge-cat{background:#e3f6f8;color:#16808f;font-weight:600}
.pre{white-space:pre-wrap}
</style>
<script src="{% static 'js/config.js' %}"></script>
</head>
<body>
<div class="bg"></div><div class="bg bg2"></div><div class="bg bg3"></div>
<div class="d-flex justify-content-center align-items-start" style="min-height:100vh;padding:2rem 0;">
<div class="card" style="max-width:720px;width:100%;margin:1rem;box-shadow:0 1rem 3rem rgba(0,0,0,.25);">
<div class="card-body p-4">
  <div class="text-center"><img class="mb-3" src="{% static 'images/Doconnect.jpg' %}" height="80" alt="DoConnect Logo"></div>

  <div class="panel active" id="panelList">
    <div class="eyebrow">Careers</div>
    <h1 class="h3 mb-3">Open positions</h1>
    <div id="listError" class="err" style="display:none"></div>
    <div id="vacList"><p class="text-muted">Loading...</p></div>
    <a class="teal-link small" href="/">Back to home</a>
  </div>

  <div class="panel" id="panelDetail">
    <a href="#" class="teal-link small" id="backLink">&larr; All positions</a>
    <div class="eyebrow mt-3" id="dClinic"></div>
    <h1 class="h3 mb-1" id="dTitle"></h1>
    <span class="badge badge-cat" id="dCat"></span>
    <div class="section-title">About the role</div><div class="pre" id="dDesc"></div>
    <div class="section-title">Requirements</div><div class="pre" id="dReq"></div>
    <div class="section-title">Qualifications</div><div class="pre" id="dQual"></div>

    <div class="section-title">Apply</div>
    <div id="applyMsg"></div>
    <form id="applyForm" novalidate>
      <label class="form-label" for="cv">Your CV (PDF, DOC or DOCX, up to 5 MB)</label>
      <input type="file" class="form-control mb-3" id="cv" accept=".pdf,.doc,.docx">
      <label class="form-label" for="cover">Cover letter (optional)</label>
      <textarea class="form-control mb-3" id="cover" rows="4"></textarea>
      <button class="btn btn-teal" id="applyBtn" type="submit">Submit application</button>
    </form>
    <p class="small mt-3" id="loginHint" style="display:none">You need to <a class="teal-link" href="/">sign in</a> to apply.</p>
    <p class="small mt-3" id="myLink" style="display:none"><a class="teal-link" href="/my-applications/">My applications</a></p>
  </div>
</div></div></div>

<script>
// Endpoints (recruitment API doc): list and detail are public; apply needs a login and is multipart (cv, cover_letter).
//   GET  /api/recruitment/vacancies/            GET /api/recruitment/vacancies/{id}/
//   POST /api/recruitment/vacancies/{id}/apply/  (409 = already applied)
const token = localStorage.getItem('accessToken');
const MAX = 5 * 1024 * 1024;
let current = null;
const $ = id => document.getElementById(id);
const hdr = () => token ? { 'Authorization': 'Bearer ' + token } : {};
function show(id){ document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === id)); }
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function msg(d){ if (!d) return 'Something went wrong.'; if (typeof d === 'string') return d;
  if (d.detail) return d.detail; return Object.entries(d).map(([k,v]) => k + ': ' + (Array.isArray(v) ? v.join(' ') : v)).join(' | '); }

async function loadList(){
  try {
    const r = await fetch(API_BASE_URL + '/api/recruitment/vacancies/', { headers: hdr() });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(msg(d));
    const items = Array.isArray(d) ? d : (d.results || d.vacancies || []);
    $('vacList').innerHTML = items.length ? items.map(v =>
      '<div class="vac" data-id="' + v.id + '"><div class="d-flex justify-content-between align-items-start">' +
      '<div><strong>' + esc(v.title) + '</strong><div class="small text-muted">' + esc(v.clinic_name) + '</div></div>' +
      '<span class="badge badge-cat">' + esc(v.staff_category) + '</span></div></div>').join('')
      : '<p class="text-muted">There are no open positions right now.</p>';
  } catch (e) {
    $('vacList').innerHTML = '';
    $('listError').style.display = 'block'; $('listError').textContent = 'Could not load positions. ' + e.message;
  }
}

async function openVacancy(id){
  try {
    const r = await fetch(API_BASE_URL + '/api/recruitment/vacancies/' + encodeURIComponent(id) + '/', { headers: hdr() });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(msg(d));
    const v = d.vacancy || d; current = v;
    $('dClinic').textContent = v.clinic_name || ''; $('dTitle').textContent = v.title || '';
    $('dCat').textContent = v.staff_category || ''; $('dDesc').textContent = v.description || '';
    $('dReq').textContent = v.requirements || ''; $('dQual').textContent = v.qualifications || '';
    $('applyMsg').innerHTML = ''; $('applyForm').style.display = token ? 'block' : 'none';
    $('loginHint').style.display = token ? 'none' : 'block'; $('myLink').style.display = token ? 'block' : 'none';
    show('panelDetail');
  } catch (e) { $('listError').style.display = 'block'; $('listError').textContent = e.message; show('panelList'); }
}

$('vacList').addEventListener('click', e => { const c = e.target.closest('.vac'); if (c) { history.replaceState(null,'','?vacancy=' + c.dataset.id); openVacancy(c.dataset.id); } });
$('backLink').addEventListener('click', e => { e.preventDefault(); history.replaceState(null,'',location.pathname); show('panelList'); });

$('applyForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = $('cv').files[0], box = $('applyMsg');
  if (!f) { box.innerHTML = '<div class="err">Please choose your CV.</div>'; return; }
  if (f.size > MAX) { box.innerHTML = '<div class="err">The CV is larger than 5 MB.</div>'; return; }
  const fd = new FormData(); fd.append('cv', f);
  if ($('cover').value.trim()) fd.append('cover_letter', $('cover').value.trim());
  $('applyBtn').disabled = true; $('applyBtn').textContent = 'Submitting...';
  try {
    const r = await fetch(API_BASE_URL + '/api/recruitment/vacancies/' + encodeURIComponent(current.id) + '/apply/', { method: 'POST', headers: hdr(), body: fd });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { box.innerHTML = '<div class="err">Please <a href="/">sign in</a> and try again.</div>'; return; }
    if (r.status === 409) { box.innerHTML = '<div class="err">You have already applied for this position.</div>'; return; }
    if (!r.ok) throw new Error(msg(d));
    box.innerHTML = '<div class="ok">Application submitted. You can follow it on <a href="/my-applications/">My applications</a>.</div>';
    $('applyForm').style.display = 'none';
  } catch (err) { box.innerHTML = '<div class="err">' + esc(err.message) + '</div>'; }
  finally { $('applyBtn').disabled = false; $('applyBtn').textContent = 'Submit application'; }
});

loadList();
const q = new URLSearchParams(location.search).get('vacancy'); if (q) openVacancy(q);
</script>
</body></html>
