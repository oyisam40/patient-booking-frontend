{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCONNECT</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <style>
        * { box-sizing: border-box; }
        :root {
            --overlay: linear-gradient(135deg, rgba(27,154,170,0.82), rgba(79,209,197,0.82));
            --card-bg: #fff;
            --text-main: #1a1a1a;
            --text-muted: #555;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--overlay), url("{% static 'images/alterfines-medicine-2361046_1920.jpg' %}") center/cover no-repeat fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .tagline {
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .brand {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-size: 64px;
            font-weight: 900;
            margin: 0 0 16px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
        }
        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 16px;
            max-width: 480px;
            margin: 0 0 36px;
            line-height: 1.6;
        }
        .get-started-btn {
            padding: 16px 40px;
            background: #fff;
            color: #1a1a1a;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .get-started-btn:hover { opacity: 0.92; }

        .overlay-bg {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .overlay-bg.open { display: flex; }
        .choice-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
        }
        .choice-card h2 {
            margin: 0 0 8px;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
        }
        .choice-card p {
            margin: 0 0 24px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .choice-options { display: flex; gap: 14px; }
        .choice-option {
            flex: 1;
            padding: 20px 14px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 12px;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            display: block;
        }
        .choice-option:hover { border-color: #1B9AAA; color: #1B9AAA; }
        .choice-option .emoji { font-size: 28px; display: block; margin-bottom: 8px; }
        .close-choice {
            margin-top: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
        }

        .back-link {
            display: block;
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
        }
        .back-link:hover { color: #1B9AAA; }
    </style>
</head>
<body>

<div class="tagline">For your convenience</div>
<h1 class="brand">DoConnect</h1>
<p class="subtitle">Book appointments with trusted doctors, or manage your practice — all in one place.</p>
<button class="get-started-btn" id="getStartedBtn">Get Started</button>

<div class="overlay-bg" id="choiceOverlay">
    <div class="choice-card" id="mainChoiceCard">
        <h2>How would you like to continue?</h2>
        <p>Choose the option that fits you.</p>
        <div class="choice-options">
            <a class="choice-option" href="{% url 'home' %}">

                Sign In
            </a>
            <button class="choice-option" id="registerChoiceBtn" type="button">

                Register
            </button>
        </div>
        <button class="close-choice" id="closeChoiceBtn">Cancel</button>
    </div>

    <div class="choice-card" id="roleChoiceCard" style="display: none;">
        <h2>Register as...</h2>
        <p>Let us know which type of account to create</p>
        <div class="choice-options">
            <a class="choice-option" href="{%  url 'register' %}">
                Patient
            </a>
            <a class="choice-option" href="{% url 'doctor_register' %}">
                Doctor
            </a>
        </div>
        <button class="back-link" id="backToMainBtn" type="button">Back</button>
                <button class="close-choice" id="closeChoiceBtn2">Cancel</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js" integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V" crossorigin="anonymous"></script>
<script>

    const overlay = document.getElementById('choiceOverlay');
    const mainCard = document.getElementById('mainChoiceCard');
    const roleCard = document.getElementById('roleChoiceCard')
    document.getElementById('getStartedBtn').addEventListener('click', () => {
        overlay.classList.add('open');
    });
    document.getElementById('closeChoiceBtn').addEventListener('click', () => {
        overlay.classList.remove('open');
    });

    document.getElementById('closeChoiceBtn2').addEventListener('click', ()=> {
        overlay.classList.remove('open');
    });

    document.getElementById('registerChoiceBtn').addEventListener('click', () => {
    mainCard.style.display = 'none';
    roleCard.style.display = 'block';
    });

    document.getElementById('backToMainBtn').addEventListener('click', () => {
        roleCard.style.display = 'none';
        mainCard.style.display = 'block';
    });
</script>
</body>
</html>
