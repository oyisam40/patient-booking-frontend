{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCONNECT - Clinic Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1B9AAA;
            min-height: 100vh;
        }
        .app-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1050;
        }
        .sidebar-toggle {
            background: none;
            border: none;
            font-size: 22px;
            color: #1B9AAA;
            cursor: pointer;
            padding: 4px 10px;
            margin-right: 12px;
        }
        .app-logo {
            font-weight: 700;
            color: #1B9AAA;
            font-size: 18px;
            margin-right: 20px;
        }
        .app-page-title {
            font-size: 16px;
            color: #555;
            font-weight: 600;
        }
        .app-sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 240px;
            height: calc(100vh - 60px);
            background: #fff;
            box-shadow: 2px 0 8px rgba(0,0,0,0.08);
            z-index: 1040;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .sidebar-links {
            padding: 20px 0;
        }
        .sidebar-link {
            display: block;
            padding: 12px 24px;
            color: #555;
            text-decoration: none;
            font-size: 15px;
            border-left: 3px solid transparent;
        }
        .sidebar-link:hover {
            background: #f4f7f8;
            color: #1B9AAA;
        }
        .sidebar-link.active {
            background: #eafaf9;
            color: #1B9AAA;
            border-left-color: #1B9AAA;
            font-weight: 600;
        }
        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid #eee;
        }
        .sidebar-logout {
            background: none;
            border: none;
            color: #c0392b;
            font-size: 15px;
            cursor: pointer;
            padding: 0;
        }
        .sidebar-logout:hover {
            color: #a93226;
            text-decoration: underline;
        }
        .app-content {
            margin-left: 240px;
            margin-top: 60px;
            padding: 40px 20px;
            transition: margin-left 0.3s ease;
        }
        body.sidebar-collapsed .app-sidebar {
            transform: translateX(-100%);
        }
        body.sidebar-collapsed .app-content {
            margin-left: 0;
        }

        .page-card {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .clinic-name-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .cal-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .cal-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cal-range {
            font-weight: 700;
            font-size: 16px;
            min-width: 200px;
            text-align: center;
        }

        .cal-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 12px;
            color: #777;
            margin-bottom: 14px;
        }

        .legend-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            margin-right: 5px;
        }

        .cal-scroll {
            overflow-x: auto;
            border: 1px solid #eee;
            border-radius: 12px;
        }

        .cal-table {
            width: 100%;
            min-width: 820px;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .cal-table th,
        .cal-table td {
            border-bottom: 1px solid #f0f0f0;
            border-right: 1px solid #f0f0f0;
            vertical-align: top;
        }

        .cal-table th:last-child,
        .cal-table td:last-child {
            border-right: none;
        }

        .cal-table thead th {
            background: #f8fafb;
            text-align: center;
            padding: 10px 4px;
            font-size: 13px;
            color: #555;
        }

        .cal-table thead th.today {
            background: #eafaf9;
            color: #1B9AAA;
        }

        .cal-table thead th .day-num {
            display: block;
            font-size: 18px;
            font-weight: 700;
        }

        .cal-table .time-col {
            width: 64px;
            background: #f8fafb;
            text-align: center;
            font-size: 12px;
            color: #888;
            padding-top: 8px;
        }

        .cal-table td.cell {
            height: 64px;
            padding: 3px;
        }

        .cal-table td.cell.today {
            background: #fbfefe;
        }

        .appt-chip {
            display: block;
            width: 100%;
            text-align: left;
            border: none;
            border-left: 4px solid;
            border-radius: 6px;
            padding: 3px 6px;
            margin-bottom: 3px;
            font-size: 11px;
            line-height: 1.25;
            cursor: pointer;
        }

        .appt-chip .chip-patient {
            font-weight: 700;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .appt-chip .chip-doctor {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.85;
        }

        .chip-pending {
            background-color: #fff3cd;
            border-left-color: #e0a800;
            color: #856404;
        }

        .chip-confirmed {
            background-color: #d4edda;
            border-left-color: #28a745;
            color: #155724;
        }

        .chip-completed {
            background-color: #d1ecf1;
            border-left-color: #17a2b8;
            color: #0c5460;
        }

        .chip-cancelled {
            background-color: #f8d7da;
            border-left-color: #dc3545;
            color: #721c24;
            text-decoration: line-through;
        }

        .legend-pending { background: #e0a800; }
        .legend-confirmed { background: #28a745; }
        .legend-completed { background: #17a2b8; }
        .legend-cancelled { background: #dc3545; }

        .week-summary {
            font-size: 13px;
            color: #888;
            margin-top: 14px;
        }

        .btn-teal {
            background-color: #1B9AAA;
            border-color: #1B9AAA;
            color: white;
        }
        .btn-teal:hover {
            background-color: #16808f;
            border-color: #16808f;
            color: white;
        }

        .modal-backdrop-custom {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1060;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-backdrop-custom.open {
            display: flex;
        }

        .detail-modal {
            background: #fff;
            border-radius: 12px;
            padding: 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.2);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #888;
        }

        .detail-value {
            font-weight: 600;
            text-align: right;
        }

        .loading-state {
            text-align: center;
            color: #999;
            padding: 30px 0;
        }

        @media (max-width: 768px) {
            .page-card {
                padding: 24px 16px;
            }
        }
    </style>
    <script src="{% static 'js/guard.js' %}"></script>
    <script src="{% static 'js/config.js' %}"></script>
    <script src="{% static 'js/clinic_context.js' %}"></script>
</head>
<body>

    <header class="app-topbar">
        <button type="button" class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
        <span class="app-logo">DOCONNECT</span>
        <span class="app-page-title">Calendar</span>
    </header>

    <nav class="app-sidebar" id="appSidebar">
        <div class="sidebar-links">
            <a href="{% url 'clinic_dashboard' %}" class="sidebar-link">Dashboard</a>
            <a href="{% url 'clinic_doctors_staff' %}" class="sidebar-link">Doctors &amp; Staff</a>
            <a href="{% url 'clinic_calendar' %}" class="sidebar-link active">Calendar</a>
            <a href="{% url 'clinic_appointments' %}" class="sidebar-link">Appointments</a>
            <a href="{% url 'clinic_reports' %}" class="sidebar-link">Reports</a>
            <a href="{% url 'clinic_settings' %}" class="sidebar-link">Clinic Settings</a>
            <a href="{% url 'notifications' %}" class="sidebar-link">Notifications</a>
        </div>
        <div class="sidebar-footer">
            <button type="button" class="sidebar-logout" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="app-content">
        <div class="page-card">
            <h1 class="h3 mb-1 font-weight-normal">Clinic Calendar</h1>
            <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
                <div class="clinic-name-label mb-0" id="clinicNameLabel"></div>
                <select id="clinicSelect" class="form-select form-select-sm" style="max-width:260px;display:none;" aria-label="Clinic"></select>
            </div>

            <div class="cal-toolbar">
                <div class="cal-nav">
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="prevWeekBtn">&larr; Prev</button>
                    <div class="cal-range" id="rangeLabel"></div>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="nextWeekBtn">Next &rarr;</button>
                    <button type="button" class="btn btn-teal btn-sm ms-2" id="todayBtn">Today</button>
                </div>

                <div class="cal-filters">
                    <select id="filterDoctor" class="form-select form-select-sm" style="min-width: 170px;">
                        <option value="">All doctors</option>
                    </select>
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" id="showCancelled">
                        <label class="form-check-label" for="showCancelled" style="font-size: 14px;">Show cancelled</label>
                    </div>
                </div>
            </div>

            <div class="legend">
                <span><span class="legend-dot legend-pending"></span>Pending</span>
                <span><span class="legend-dot legend-confirmed"></span>Confirmed</span>
                <span><span class="legend-dot legend-completed"></span>Completed</span>
                <span><span class="legend-dot legend-cancelled"></span>Cancelled</span>
            </div>

            <div class="loading-state" id="loadingState">Loading calendar...</div>

            <div class="cal-scroll" id="calScroll" style="display:none;">
                <table class="cal-table">
                    <thead id="calHead"></thead>
                    <tbody id="calBody"></tbody>
                </table>
            </div>

            <div class="week-summary" id="weekSummary"></div>
        </div>
    </div>

    <div class="modal-backdrop-custom" id="detailModalBackdrop">
        <div class="detail-modal">
            <h5 class="mb-3">Appointment Details</h5>
            <div id="detailBody"></div>
            <div class="text-muted mt-3" style="font-size: 12px;">
                To cancel an appointment, use the Appointments page.
            </div>
            <button type="button" class="btn btn-outline-secondary w-100 mt-3" id="detailCloseBtn">Close</button>
        </div>
    </div>

<script>
    const token = localStorage.getItem('accessToken');

    document.getElementById('sidebarToggle').addEventListener('click', function () {
        document.body.classList.toggle('sidebar-collapsed');
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('refreshToken');
        window.location.href = "{% url 'home' %}";
    });

    // Real endpoint (Ntsako): GET /api/bookings/admin/ -> { count, bookings: [...] }.
    // Every booking has: id, clinic, patient_name, doctor (profile id), doctor_name,
    // appointment_date, appointment_time, status, status_display, reason.
    // All of this admin's bookings come back at once; the page keeps only those of the
    // selected clinic and shows one week at a time. Slots are fixed 1-hour slots.
    // This page is read-only on purpose: cancelling lives on the Appointments page.
    // TODO: working hours should come from the clinic settings; for now the grid
    // shows 08:00-17:00 and widens to fit any booking outside that range.

    const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const DEFAULT_START_HOUR = 8;
    const DEFAULT_END_HOUR = 17;

    let clinicName = '';
    let currentClinicId = null;
    let appointments = [];
    let weekStart = getMonday(new Date());

    // Names and reasons are typed in by users and end up inside
    // innerHTML below, so they are escaped first.
    function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
    }

    // Local-time YYYY-MM-DD. toISOString() would convert to UTC and can
    // shift the date by a day for users ahead of or behind UTC.
    function toISODate(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function addDays(d, n) {
        const copy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        copy.setDate(copy.getDate() + n);
        return copy;
    }

    function getMonday(d) {
        const copy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const jsDay = copy.getDay();               // Sun=0..Sat=6
        const diff = jsDay === 0 ? -6 : 1 - jsDay; // back to Monday
        copy.setDate(copy.getDate() + diff);
        return copy;
    }

    function formatLongDate(isoDate) {
        const d = new Date(isoDate + 'T00:00:00');
        return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    function formatTime(timeValue) {
        return String(timeValue).slice(0, 5);
    }

    function getHour(timeValue) {
        return parseInt(String(timeValue).slice(0, 2), 10);
    }

    function chipClass(status) {
        if (status === 'CONFIRMED') return 'chip-confirmed';
        if (status === 'COMPLETED') return 'chip-completed';
        if (status === 'CANCELLED') return 'chip-cancelled';
        return 'chip-pending'; // PENDING_PAYMENT, PENDING_DOCTOR
    }

    // =========================================================
    // LOAD
    // =========================================================

    function showLoadMessage(message) {
        document.getElementById('calScroll').style.display = 'none';
        document.getElementById('weekSummary').textContent = '';
        document.getElementById('loadingState').textContent = message;
        document.getElementById('loadingState').style.display = 'block';
    }

    function describeError(status) {
        if (status === 401) return 'You are not logged in. Please log in again.';
        if (status === 403) return "You don't have access to this clinic's calendar.";
        return `Could not load the calendar (HTTP ${status}).`;
    }

    function clinicListError(reason) {
        if (reason === 401) return showLoadMessage('You are not logged in. Please log in again.');
        if (reason === 403) return showLoadMessage("You don't have access to any clinic.");
        if (reason === 'none') return showLoadMessage('No clinics found.');
        if (reason === 0) return showLoadMessage('Could not reach the server. Please try again later.');
        showLoadMessage(`Could not load clinics (HTTP ${reason}).`);
    }

    async function loadData(clinicId, clinic) {
        currentClinicId = clinicId;
        clinicName = clinic && clinic.name ? clinic.name : '';
        appointments = [];
        document.getElementById('clinicNameLabel').textContent = clinicName;
        showLoadMessage('Loading calendar...');

        let response;
        let data;
        try {
            response = await fetch(`${API_BASE_URL}/api/bookings/admin/`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });
            data = await response.json().catch(() => null);
        } catch (error) {
            console.error(error);
            if (String(currentClinicId) === String(clinicId)) {
                showLoadMessage('Could not reach the server. Please try again later.');
            }
            return;
        }

        if (String(currentClinicId) !== String(clinicId)) return; // clinic switched meanwhile

        if (!response.ok) {
            showLoadMessage(describeError(response.status));
            return;
        }

        const list = data && (data.bookings || data.results || data);
        appointments = (Array.isArray(list) ? list : [])
            .filter(b => String(b.clinic) === String(clinicId));

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('calScroll').style.display = 'block';
        document.getElementById('filterDoctor').value = '';
        buildDoctorFilter();
        renderCalendar();
    }

    function buildDoctorFilter() {
        const select = document.getElementById('filterDoctor');
        const doctorNames = {};

        appointments.forEach(a => { doctorNames[a.doctor] = a.doctor_name; });

        const ids = Object.keys(doctorNames).sort((a, b) => doctorNames[a].localeCompare(doctorNames[b]));

        select.innerHTML = '<option value="">All doctors</option>' +
            ids.map(id => `<option value="${escapeHtml(id)}">Dr. ${escapeHtml(doctorNames[id])}</option>`).join('');
    }

    // =========================================================
    // RENDER
    // =========================================================

    function getVisibleAppointments() {
        const doctor = document.getElementById('filterDoctor').value;
        const showCancelled = document.getElementById('showCancelled').checked;
        const fromDate = toISODate(weekStart);
        const toDate = toISODate(addDays(weekStart, 6));

        return appointments
            .filter(a => a.appointment_date >= fromDate && a.appointment_date <= toDate)
            .filter(a => !doctor || String(a.doctor) === doctor)
            .filter(a => showCancelled || a.status !== 'CANCELLED');
    }

    function renderCalendar() {
        document.getElementById('clinicNameLabel').textContent = clinicName;

        const days = [];
        for (let i = 0; i < 7; i++) days.push(addDays(weekStart, i));

        const weekEnd = days[6];
        document.getElementById('rangeLabel').textContent =
            weekStart.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' - ' +
            weekEnd.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

        const todayStr = toISODate(new Date());
        const visible = getVisibleAppointments();

        // Default hours, widened if a booking falls outside them.
        let startHour = DEFAULT_START_HOUR;
        let endHour = DEFAULT_END_HOUR;
        visible.forEach(a => {
            const h = getHour(a.appointment_time);
            if (h < startHour) startHour = h;
            if (h > endHour) endHour = h;
        });

        // Header row
        let headHtml = '<tr><th class="time-col"></th>';
        days.forEach((d, i) => {
            const isToday = toISODate(d) === todayStr;
            headHtml += `<th class="${isToday ? 'today' : ''}">${DAY_NAMES[i]}<span class="day-num">${d.getDate()}</span></th>`;
        });
        headHtml += '</tr>';
        document.getElementById('calHead').innerHTML = headHtml;

        // Body rows, one per hour
        let bodyHtml = '';
        for (let hour = startHour; hour <= endHour; hour++) {
            const hourLabel = String(hour).padStart(2, '0') + ':00';
            bodyHtml += `<tr><td class="time-col">${hourLabel}</td>`;

            days.forEach(d => {
                const dateStr = toISODate(d);
                const cellAppts = visible.filter(a =>
                    a.appointment_date === dateStr && getHour(a.appointment_time) === hour);

                bodyHtml += `<td class="cell ${dateStr === todayStr ? 'today' : ''}">` +
                    cellAppts.map(chipHtml).join('') + '</td>';
            });

            bodyHtml += '</tr>';
        }
        document.getElementById('calBody').innerHTML = bodyHtml;

        document.querySelectorAll('.appt-chip').forEach(chip => {
            chip.addEventListener('click', () => openDetail(chip.getAttribute('data-id')));
        });

        document.getElementById('weekSummary').textContent =
            `${visible.length} appointment${visible.length === 1 ? '' : 's'} this week`;
    }

    function chipHtml(appt) {
        return `
            <button type="button" class="appt-chip ${chipClass(appt.status)}" data-id="${escapeHtml(appt.id)}">
                <span class="chip-patient">${escapeHtml(appt.patient_name)}</span>
                <span class="chip-doctor">Dr. ${escapeHtml(appt.doctor_name)}</span>
            </button>
        `;
    }

    // =========================================================
    // NAVIGATION + FILTERS
    // =========================================================

    function changeWeek(deltaWeeks) {
        weekStart = addDays(weekStart, deltaWeeks * 7);
        renderCalendar();
    }

    document.getElementById('prevWeekBtn').addEventListener('click', () => changeWeek(-1));
    document.getElementById('nextWeekBtn').addEventListener('click', () => changeWeek(1));

    document.getElementById('todayBtn').addEventListener('click', function () {
        weekStart = getMonday(new Date());
        renderCalendar();
    });

    document.getElementById('filterDoctor').addEventListener('change', renderCalendar);
    document.getElementById('showCancelled').addEventListener('change', renderCalendar);

    // =========================================================
    // DETAILS
    // =========================================================

    function detailRow(label, value) {
        return `<div class="detail-row"><span class="detail-label">${label}</span><span class="detail-value">${value}</span></div>`;
    }

    function openDetail(id) {
        const appt = appointments.find(a => String(a.id) === String(id));
        if (!appt) return;

        let html = '';
        html += detailRow('Patient', escapeHtml(appt.patient_name));
        html += detailRow('Doctor', 'Dr. ' + escapeHtml(appt.doctor_name));
        html += detailRow('Date', escapeHtml(formatLongDate(appt.appointment_date)));
        html += detailRow('Time', escapeHtml(formatTime(appt.appointment_time)));
        html += detailRow('Status', escapeHtml(appt.status_display || appt.status));
        if (appt.reason) html += detailRow('Reason', escapeHtml(appt.reason));
        if (appt.status === 'CANCELLED' && appt.cancellation_reason) {
            html += detailRow('Cancelled because', escapeHtml(appt.cancellation_reason));
        }

        document.getElementById('detailBody').innerHTML = html;
        document.getElementById('detailModalBackdrop').classList.add('open');
    }

    function closeDetail() {
        document.getElementById('detailModalBackdrop').classList.remove('open');
    }

    document.getElementById('detailCloseBtn').addEventListener('click', closeDetail);

    // =========================================================
    // INITIAL LOAD
    // =========================================================

    ClinicContext.init({
        selectId: 'clinicSelect',
        onSelect: loadData,
        onError: clinicListError
    });
</script>
</body>
</html>
