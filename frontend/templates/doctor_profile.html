{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCONNECT - Doctor Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1B9AAA;
            min-height: 100vh;
        }
        .app-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1050;
        }
        .sidebar-toggle {
            background: none;
            border: none;
            font-size: 22px;
            color: #1B9AAA;
            cursor: pointer;
            padding: 4px 10px;
            margin-right: 12px;
        }
        .app-logo {
            font-weight: 700;
            color: #1B9AAA;
            font-size: 18px;
            margin-right: 20px;
        }
        .app-page-title {
            font-size: 16px;
            color: #555;
            font-weight: 600;
        }
        .app-sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 240px;
            height: calc(100vh - 60px);
            background: #fff;
            box-shadow: 2px 0 8px rgba(0,0,0,0.08);
            z-index: 1040;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .sidebar-links {
            padding: 20px 0;
        }
        .sidebar-link {
            display: block;
            padding: 12px 24px;
            color: #555;
            text-decoration: none;
            font-size: 15px;
            border-left: 3px solid transparent;
        }
        .sidebar-link:hover {
            background: #f4f7f8;
            color: #1B9AAA;
        }
        .sidebar-link.active {
            background: #eafaf9;
            color: #1B9AAA;
            border-left-color: #1B9AAA;
            font-weight: 600;
        }
        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid #eee;
        }
        .sidebar-logout {
            background: none;
            border: none;
            color: #c0392b;
            font-size: 15px;
            cursor: pointer;
            padding: 0;
        }
        .sidebar-logout:hover {
            color: #a93226;
            text-decoration: underline;
        }
        .app-content {
            margin-left: 240px;
            margin-top: 60px;
            padding: 40px 20px;
            transition: margin-left 0.3s ease;
        }
        body.sidebar-collapsed .app-sidebar {
            transform: translateX(-100%);
        }
        body.sidebar-collapsed .app-content {
            margin-left: 0;
        }
        .profile-card {
            max-width: 720px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.1);
            padding: 40px;
        }
        .profile-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #1B9AAA;
            background-color: #e0f2f3;
        }
        .doctor-name {
            font-weight: 700;
            margin-top: 16px;
        }
        .specialization-badge {
            background-color: #1B9AAA;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin-top: 8px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .info-label {
            color: #777;
            font-size: 14px;
        }
        .info-value {
            font-weight: 600;
            color: #222;
        }
        .loading-text {
            text-align: center;
            color: #999;
            padding: 40px;
        }
        .btn-teal {
            background-color: #1B9AAA;
            border-color: #1B9AAA;
            color: white;
        }
        .btn-teal:hover {
            background-color: #16808f;
            border-color: #16808f;
            color: white;
        }
    </style>
    <script src="{% static 'js/config.js' %}"></script>
</head>
<body>

    <header class="app-topbar">
        <button type="button" class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
        <span class="app-logo">DOCONNECT</span>
        <span class="app-page-title">My Profile</span>
    </header>

    <nav class="app-sidebar" id="appSidebar">
        <div class="sidebar-links">
            <a href="{% url 'doctor_profile' %}" class="sidebar-link active">Profile</a>
            <a href="{% url 'doctor_availability' %}" class="sidebar-link">Set Availability</a>
            <a href="{% url 'doctor_appointments' %}" class="sidebar-link">My Appointments</a>
            <a href="{% url 'notifications' %}" class="sidebar-link">Notifications</a>
        </div>
        <div class="sidebar-footer">
            <button type="button" class="sidebar-logout" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="app-content">
<div class="profile-card" id="profileCard">
    <div class="text-center" id="loadingState">
        <p class="loading-text">Loading profile...</p>
    </div>

    <div id="profileContent" style="display:none;">
        <div class="text-center">
            <img id="profilePhoto" src="{% static 'images/Doconnect.jpg' %}" class="profile-photo" alt="Doctor Photo">
            <h2 class="doctor-name" id="doctorName">Dr.</h2>
            <span class="specialization-badge" id="specializationBadge"></span>
        </div>

        <hr class="my-4">

        <div class="info-row">
            <span class="info-label">Qualification</span>
            <span class="info-value" id="qualification"></span>
        </div>

        <div class="info-row">
            <span class="info-label">Medical Registration</span>
            <span class="info-value" id="medicalRegNumber"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Years of Experience</span>
            <span class="info-value" id="yearsExperience"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Consultation Fee</span>
            <span class="info-value" id="consultationFee"></span>
        </div>

        <div class="text-center mt-4">
            <a href="{% url 'doctor_profile_edit' %}" class="btn btn-teal">Edit Profile</a>
        </div>
    </div>

    <div id="errorState" style="display:none;" class="text-center text-danger">
        Could not load profile. Please try again later.
    </div>
</div>
    </div>

<script>
    document.getElementById('sidebarToggle').addEventListener('click', function () {
        document.body.classList.toggle('sidebar-collapsed');
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('refreshToken');
        window.location.href = "{% url 'home' %}";
    });

    async function loadDoctorProfile() {
        const token = localStorage.getItem('accessToken');

        try {
            const response = await fetch(API_BASE_URL + '/api/doctors/doctor/me/', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error('Failed to fetch profile');
            }

            const data = await response.json();

            document.getElementById('doctorName').textContent = `Dr. ${data.first_name} ${data.last_name}`;
            document.getElementById('specializationBadge').textContent = data.specialization;
            document.getElementById('qualification').textContent = data.qualification;
            document.getElementById('medicalRegNumber').textContent = data.medical_registration_number;
            document.getElementById('yearsExperience').textContent = `${data.years_of_experience} years`;
            document.getElementById('consultationFee').textContent = `R${data.consultation_fee}`;

            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('profileContent').style.display = 'block';

        } catch (error) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            console.error(error);
        }
    }

    loadDoctorProfile();
</script>
</body>
</html>
