{% load static %}
<nav class="pub-nav" aria-label="Main">
    <a class="pub-brand" href="/">
        <img src="{% static 'images/Doconnect.jpg' %}" alt="" onerror="this.style.display='none'">
        DOCONNECT
    </a>
    <button type="button" class="pub-toggle" id="pubToggle" aria-label="Menu">&#9776;</button>
    <div class="pub-links" id="pubLinks">
        <a href="{% url 'public_home' %}">Home</a>
        <a href="{% url 'public_about' %}">About us</a>
        <a href="{% url 'public_services' %}">Services</a>
        <a href="{% url 'public_join' %}">Join us</a>
        <a href="{% url 'public_contact' %}">Contact us</a>
        <span style="flex:1"></span>
        <a href="{% url 'home' %}" class="pub-cta">Login</a>
    </div>
</nav>
<script>
    (function () {
        var here = location.pathname.replace(/\/+$/, '');
        document.querySelectorAll('#pubLinks a').forEach(function (a) {
            if (a.classList.contains('pub-cta')) return;
            if (a.pathname.replace(/\/+$/, '') === here) a.classList.add('active');
        });
    })();
</script>
