{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My applications - DOCONNECT</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.bg{animation:slide 3s ease-in-out infinite alternate;background-image:linear-gradient(-60deg,#1B9AAA 50%,#4FD1C5 50%);bottom:0;left:-50%;opacity:.5;position:fixed;right:-50%;top:0;z-index:-1}
.bg2{animation-direction:alternate-reverse;animation-duration:4s}.bg3{animation-duration:5s}
@keyframes slide{0%{transform:translateX(-25%)}100%{transform:translateX(25%)}}
body{min-height:100vh}
.btn-teal{background:#1B9AAA;border-color:#1B9AAA;color:#fff}.btn-teal:hover:not(:disabled){background:#16808f;border-color:#16808f;color:#fff}.btn-teal:disabled{background:#1B9AAA;color:#fff;opacity:.6}
.teal-link{color:#1B9AAA;text-decoration:none}.teal-link:hover{text-decoration:underline}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#1B9AAA}
.section-title{font-size:14px;font-weight:700;color:#1B9AAA;text-transform:uppercase;letter-spacing:.03em;margin:20px 0 10px}
.err{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;border-radius:8px;padding:12px 16px;font-size:14px;margin-bottom:16px}
.ok{background:#d4edda;color:#155724;border:1px solid #c3e6cb;border-radius:8px;padding:12px 16px;font-size:14px;margin-bottom:16px}
.panel{display:none}.panel.active{display:block}
.vac{border:1px solid #dee2e6;border-radius:10px;padding:14px 16px;margin-bottom:12px;cursor:pointer;background:#fff}
.vac:hover{border-color:#1B9AAA}
.badge-cat{background:#e3f6f8;color:#16808f;font-weight:600}
.pre{white-space:pre-wrap}

.nav-tabs .nav-link{color:#16808f}.nav-tabs .nav-link.active{color:#000;font-weight:600}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#e9ecef;color:#495057}
.st.SUBMITTED,.st.UNDER_REVIEW{background:#e3f6f8;color:#16808f}.st.SHORTLISTED,.st.SCHEDULED{background:#fff3cd;color:#856404}
.st.ACCEPTED,.st.PUBLISHED,.st.COMPLETED{background:#d4edda;color:#155724}.st.REJECTED,.st.CLOSED,.st.CANCELLED,.st.NO_SHOW,.st.WITHDRAWN{background:#f8d7da;color:#721c24}
dialog{border:0;border-radius:12px;padding:20px;max-width:520px;width:92%;box-shadow:0 1rem 3rem rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sub{border-top:1px dashed #dee2e6;margin-top:10px;padding-top:10px;font-size:14px}
</style>
<script src="{% static 'js/config.js' %}"></script>
</head>
<body>
<div class="bg"></div><div class="bg bg2"></div><div class="bg bg3"></div>
<div class="d-flex justify-content-center align-items-start" style="min-height:100vh;padding:2rem 0;">
<div class="card" style="max-width:720px;width:100%;margin:1rem;box-shadow:0 1rem 3rem rgba(0,0,0,.25);">
<div class="card-body p-4">
  <div class="text-center"><img class="mb-3" src="{% static 'images/Doconnect.jpg' %}" height="80" alt="DoConnect Logo"></div>
  <div class="eyebrow">Careers</div><h1 class="h3 mb-3">My applications</h1>
  <div id="flash"></div><div id="list"><p class="text-muted">Loading...</p></div>
  <a class="teal-link small" href="/vacancies/">Browse open positions</a>
</div>
</div>
</div>
<script>
// GET /api/recruitment/my-applications/ ; POST /api/recruitment/applications/{id}/withdraw/ (only while SUBMITTED)
// GET /api/recruitment/applications/{id}/interviews/
const token = localStorage.getItem('accessToken'); if (!token) location.href = '/';
const $ = id => document.getElementById(id);
const H = { 'Authorization': 'Bearer ' + token };
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function msg(d){ if (!d) return 'Something went wrong.'; if (d.detail) return d.detail; return Object.entries(d).map(([k,v]) => k + ': ' + v).join(' | '); }
const LABEL = { SUBMITTED:'Submitted', UNDER_REVIEW:'Under review', SHORTLISTED:'Shortlisted', ACCEPTED:'Accepted', REJECTED:'Not successful', WITHDRAWN:'Withdrawn' };
function flash(t, ok){ $('flash').innerHTML = t ? '<div class="' + (ok ? 'ok' : 'err') + '">' + esc(t) + '</div>' : ''; }
async function load(){
  try {
    const r = await fetch(API_BASE_URL + '/api/recruitment/my-applications/', { headers: H });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { location.href = '/'; return; }
    if (!r.ok) throw new Error(msg(d));
    const items = Array.isArray(d) ? d : (d.results || d.applications || []);
    $('list').innerHTML = items.length ? items.map(a => '<div class="vac" style="cursor:default"><div class="d-flex justify-content-between align-items-start flex-wrap gap-2"><div><strong>' + esc(a.vacancy_title) +
      '</strong><div class="small text-muted">' + esc(a.clinic_name) + (a.created_at ? ' &middot; applied ' + esc(new Date(a.created_at).toLocaleDateString()) : '') + '</div></div>' +
      '<span class="st ' + esc(a.status) + '">' + esc(LABEL[a.status] || a.status) + '</span></div>' +
      (a.review_notes ? '<div class="small mt-2"><strong>Note from the clinic:</strong> ' + esc(a.review_notes) + '</div>' : '') +
      '<div class="d-flex gap-2 mt-2"><button class="btn btn-sm btn-outline-secondary" data-int="' + a.id + '">Interviews</button>' +
      (a.status === 'SUBMITTED' ? '<button class="btn btn-sm btn-outline-danger" data-wd="' + a.id + '">Withdraw</button>' : '') + '</div>' +
      '<div class="sub" id="int-' + a.id + '" style="display:none"></div></div>').join('') : '<p class="text-muted">You have not applied for anything yet.</p>';
  } catch (e) { $('list').innerHTML = ''; flash('Could not load your applications. ' + e.message); }
}
$('list').addEventListener('click', async e => {
  const w = e.target.closest('[data-wd]');
  if (w) { if (!confirm('Withdraw this application?')) return; w.disabled = true;
    try { const r = await fetch(API_BASE_URL + '/api/recruitment/applications/' + w.dataset.wd + '/withdraw/', { method: 'POST', headers: H });
      const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(msg(d)); flash('Application withdrawn.', true); load(); }
    catch (err) { flash(err.message); w.disabled = false; } return; }
  const i = e.target.closest('[data-int]'); if (!i) return;
  const box = $('int-' + i.dataset.int); box.style.display = box.style.display === 'none' ? 'block' : 'none'; if (box.style.display === 'none') return;
  box.textContent = 'Loading...';
  try { const r = await fetch(API_BASE_URL + '/api/recruitment/applications/' + i.dataset.int + '/interviews/', { headers: H });
    const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(msg(d));
    const items = Array.isArray(d) ? d : (d.results || []);
    box.innerHTML = items.length ? items.map(x => 'Round ' + esc(x.round_number) + ': ' + esc(new Date(x.scheduled_at).toLocaleString()) + ' (' + esc(x.duration_minutes) + ' min, ' + esc(x.method) + ') <span class="st ' + esc(x.status) + '">' + esc(x.status) + '</span>' +
      (x.location ? ' &middot; ' + esc(x.location) : '') + (x.meeting_link ? ' <a class="teal-link" target="_blank" rel="noopener" href="' + esc(x.meeting_link) + '">Join link</a>' : '')).join('<br>') : 'No interviews scheduled yet.';
  } catch (err) { box.textContent = 'Could not load interviews. ' + err.message; }
});
load();
</script>
</body>
</html>
