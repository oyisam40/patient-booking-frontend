{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCONNECT - Clinic Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1B9AAA;
            min-height: 100vh;
        }
        .app-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1050;
        }
        .sidebar-toggle {
            background: none;
            border: none;
            font-size: 22px;
            color: #1B9AAA;
            cursor: pointer;
            padding: 4px 10px;
            margin-right: 12px;
        }
        .app-logo {
            font-weight: 700;
            color: #1B9AAA;
            font-size: 18px;
            margin-right: 20px;
        }
        .app-page-title {
            font-size: 16px;
            color: #555;
            font-weight: 600;
        }
        .app-sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 240px;
            height: calc(100vh - 60px);
            background: #fff;
            box-shadow: 2px 0 8px rgba(0,0,0,0.08);
            z-index: 1040;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .sidebar-links {
            padding: 20px 0;
        }
        .sidebar-link {
            display: block;
            padding: 12px 24px;
            color: #555;
            text-decoration: none;
            font-size: 15px;
            border-left: 3px solid transparent;
        }
        .sidebar-link:hover {
            background: #f4f7f8;
            color: #1B9AAA;
        }
        .sidebar-link.active {
            background: #eafaf9;
            color: #1B9AAA;
            border-left-color: #1B9AAA;
            font-weight: 600;
        }
        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid #eee;
        }
        .sidebar-logout {
            background: none;
            border: none;
            color: #c0392b;
            font-size: 15px;
            cursor: pointer;
            padding: 0;
        }
        .sidebar-logout:hover {
            color: #a93226;
            text-decoration: underline;
        }
        .app-content {
            margin-left: 240px;
            margin-top: 60px;
            padding: 40px 20px;
            transition: margin-left 0.3s ease;
        }
        body.sidebar-collapsed .app-sidebar {
            transform: translateX(-100%);
        }
        body.sidebar-collapsed .app-content {
            margin-left: 0;
        }

        .page-card {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .clinic-name-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 12px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            min-width: 170px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 600;
            color: #777;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .result-count {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }

        .appt-row {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 16px 22px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .appt-row:last-child {
            margin-bottom: 0;
        }

        .appt-when {
            min-width: 130px;
        }

        .appt-date {
            font-weight: 700;
            font-size: 14px;
        }

        .appt-time {
            color: #1B9AAA;
            font-weight: 600;
            font-size: 15px;
        }

        .appt-details {
            flex: 1;
        }

        .appt-patient {
            font-weight: 700;
            font-size: 16px;
        }

        .appt-meta {
            font-size: 13px;
            color: #888;
            margin-top: 2px;
        }

        .appt-cancel-reason {
            font-size: 13px;
            color: #c0392b;
            margin-top: 4px;
        }

        .appt-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .appt-status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-confirmed {
            background-color: #d4edda;
            color: #155724;
        }

        .status-completed {
            background-color: #d1ecf1;
            color: #0c5460;
        }

        .status-cancelled {
            background-color: #f8d7da;
            color: #721c24;
        }

        .btn-teal {
            background-color: #1B9AAA;
            border-color: #1B9AAA;
            color: white;
        }
        .btn-teal:hover {
            background-color: #16808f;
            border-color: #16808f;
            color: white;
        }

        .modal-backdrop-custom {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1050;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-backdrop-custom.open {
            display: flex;
        }

        .cancel-modal {
            background: #fff;
            border-radius: 12px;
            padding: 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.2);
        }

        .empty-state,
        .loading-state {
            text-align: center;
            color: #999;
            padding: 30px 0;
        }

        @media (max-width: 768px) {
            .appt-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .appt-actions {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
    <script src="{% static 'js/guard.js' %}"></script>
    <script src="{% static 'js/config.js' %}"></script>
    <script src="{% static 'js/clinic_context.js' %}"></script>
</head>
<body>

    <header class="app-topbar">
        <button type="button" class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
        <span class="app-logo">DOCONNECT</span>
        <span class="app-page-title">Appointments</span>
    </header>

    <nav class="app-sidebar" id="appSidebar">
        <div class="sidebar-links">
            <a href="{% url 'clinic_dashboard' %}" class="sidebar-link">Dashboard</a>
            <a href="{% url 'clinic_doctors_staff' %}" class="sidebar-link">Doctors &amp; Staff</a>
            <a href="{% url 'clinic_calendar' %}" class="sidebar-link">Calendar</a>
            <a href="{% url 'clinic_appointments' %}" class="sidebar-link active">Appointments</a>
            <a href="{% url 'clinic_reports' %}" class="sidebar-link">Reports</a>
            <a href="{% url 'clinic_settings' %}" class="sidebar-link">Clinic Settings</a>
            <a href="{% url 'notifications' %}" class="sidebar-link">Notifications</a>
        </div>
        <div class="sidebar-footer">
            <button type="button" class="sidebar-logout" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="app-content">
        <div class="page-card">
            <h1 class="h3 mb-1 font-weight-normal">Appointments</h1>
            <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
                <div class="clinic-name-label mb-0" id="clinicNameLabel"></div>
                <select id="clinicSelect" class="form-select form-select-sm" style="max-width:260px;display:none;" aria-label="Clinic"></select>
            </div>

            <div class="filter-bar">
                <div class="filter-group">
                    <label for="filterStatus">Status</label>
                    <select id="filterStatus" class="form-select">
                        <option value="">All statuses</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterDoctor">Doctor</label>
                    <select id="filterDoctor" class="form-select">
                        <option value="">All doctors</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterDate">Date</label>
                    <input type="date" id="filterDate" class="form-control">
                </div>
                <button type="button" class="btn btn-outline-secondary" id="clearFiltersBtn">Clear filters</button>
            </div>
            <div class="result-count" id="resultCount"></div>

            <div class="loading-state" id="loadingState">Loading appointments...</div>
            <div class="empty-state" id="emptyState" style="display:none;"></div>
            <div id="appointmentList"></div>
        </div>
    </div>


<script>
    const token = localStorage.getItem('accessToken');

    document.getElementById('sidebarToggle').addEventListener('click', function () {
        document.body.classList.toggle('sidebar-collapsed');
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('refreshToken');
        window.location.href = "{% url 'home' %}";
    });

    // Real endpoint (Ntsako): GET /api/bookings/admin/  ->  { count, bookings: [...] }
    //   Platform admin gets every clinic's bookings; a clinic admin gets their
    //   own clinic's. Each booking has: id, patient_name, clinic, clinic_name,
    //   doctor (profile id), doctor_name, doctor_specialization,
    //   appointment_date, appointment_time, reason, status, status_display,
    //   payment_status, payment_status_display, cancellation_reason.
    //
    // There is no clinic-side cancel endpoint yet, so this page is view-only.
    // TODO: add cancel + refund once Ntsako builds it.
    // Filtering happens in the browser for now (no query params exist).

    const STATUS_OPTIONS = [
        { value: 'PENDING_PAYMENT', label: 'Pending payment' },
        { value: 'PENDING_DOCTOR', label: 'Pending doctor' },
        { value: 'CONFIRMED', label: 'Confirmed' },
        { value: 'COMPLETED', label: 'Completed' },
        { value: 'CANCELLED', label: 'Cancelled' },
    ];

    let clinicName = '';
    let appointments = [];
    let currentClinicId = null;

    // Names and reasons are typed in by users and end up inside
    // innerHTML below, so they are escaped first.
    function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
    }

    function formatDate(isoDate) {
        const d = new Date(isoDate + 'T00:00:00');
        return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    }

    function formatTime(timeValue) {
        return String(timeValue).slice(0, 5);
    }

    function statusClass(status) {
        if (status === 'CONFIRMED') return 'status-confirmed';
        if (status === 'COMPLETED') return 'status-completed';
        if (status === 'CANCELLED') return 'status-cancelled';
        return 'status-pending'; // PENDING_PAYMENT, PENDING_DOCTOR
    }

    // =========================================================
    // LOAD
    // =========================================================

    function describeError(status) {
        if (status === 401) return 'You are not logged in. Please log in again.';
        if (status === 403) return "You don't have access to these appointments.";
        return `Could not load appointments (HTTP ${status}).`;
    }

    function showLoadMessage(message) {
        document.getElementById('loadingState').textContent = message;
        document.getElementById('loadingState').style.display = 'block';
        document.getElementById('appointmentList').innerHTML = '';
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('resultCount').textContent = '';
    }

    function clinicListError(reason) {
        if (reason === 401) return showLoadMessage('You are not logged in. Please log in again.');
        if (reason === 403) return showLoadMessage("You don't have access to any clinic.");
        if (reason === 'none') return showLoadMessage('No clinics found.');
        if (reason === 0) return showLoadMessage('Could not reach the server. Please try again later.');
        showLoadMessage(`Could not load clinics (HTTP ${reason}).`);
    }

    async function loadData(clinicId, clinic) {
        currentClinicId = clinicId;
        clinicName = clinic && clinic.name ? clinic.name : '';
        appointments = [];
        document.getElementById('clinicNameLabel').textContent = clinicName;
        document.getElementById('filterStatus').value = '';
        document.getElementById('filterDoctor').value = '';
        document.getElementById('filterDate').value = '';
        showLoadMessage('Loading appointments...');

        let data;
        let status;

        try {
            const response = await fetch(`${API_BASE_URL}/api/bookings/admin/`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });
            status = response.status;
            data = await response.json().catch(() => null);
        } catch (error) {
            console.error(error);
            if (String(currentClinicId) === String(clinicId)) {
                showLoadMessage('Could not reach the server. Please try again later.');
            }
            return;
        }

        // The admin may have switched clinic while this was loading.
        if (String(currentClinicId) !== String(clinicId)) return;

        if (status < 200 || status >= 300) {
            showLoadMessage(describeError(status));
            return;
        }

        const all = (data && (data.bookings || data.results)) || data || [];
        // A platform admin receives every clinic's bookings: keep this clinic's.
        appointments = (Array.isArray(all) ? all : [])
            .filter(b => String(b.clinic) === String(clinicId));

        document.getElementById('loadingState').style.display = 'none';
        buildStatusFilter();
        buildDoctorFilter();
        renderAll();
    }

    function buildStatusFilter() {
        const select = document.getElementById('filterStatus');
        select.innerHTML = '<option value="">All statuses</option>' +
            STATUS_OPTIONS.map(s => `<option value="${s.value}">${s.label}</option>`).join('');
    }

    function buildDoctorFilter() {
        const select = document.getElementById('filterDoctor');
        const doctorNames = {};

        appointments.forEach(a => { doctorNames[a.doctor] = a.doctor_name; });

        const ids = Object.keys(doctorNames).sort((a, b) => doctorNames[a].localeCompare(doctorNames[b]));

        select.innerHTML = '<option value="">All doctors</option>' +
            ids.map(id => `<option value="${escapeHtml(id)}">Dr. ${escapeHtml(doctorNames[id])}</option>`).join('');
    }

    // =========================================================
    // FILTER + RENDER
    // =========================================================

    function getFilteredAppointments() {
        const status = document.getElementById('filterStatus').value;
        const doctor = document.getElementById('filterDoctor').value;
        const date = document.getElementById('filterDate').value;

        return appointments
            .filter(a => !status || a.status === status)
            .filter(a => !doctor || String(a.doctor) === doctor)
            .filter(a => !date || a.appointment_date === date)
            .sort((a, b) => (b.appointment_date + b.appointment_time).localeCompare(a.appointment_date + a.appointment_time));
    }

    function renderAll() {
        document.getElementById('clinicNameLabel').textContent = clinicName;

        const filtered = getFilteredAppointments();
        document.getElementById('resultCount').textContent =
            `Showing ${filtered.length} of ${appointments.length}`;

        renderList(filtered);
    }

    function renderList(filtered) {
        const container = document.getElementById('appointmentList');
        const emptyState = document.getElementById('emptyState');

        if (filtered.length === 0) {
            container.innerHTML = '';
            emptyState.textContent = appointments.length === 0
                ? 'No appointments yet.'
                : 'No appointments match these filters.';
            emptyState.style.display = 'block';
            return;
        }

        emptyState.style.display = 'none';
        container.innerHTML = filtered.map(appointmentRowHtml).join('');

    }

    function appointmentRowHtml(appt) {
        const statusLabel = appt.status_display || appt.status;

        return `
            <div class="appt-row">
                <div class="appt-when">
                    <div class="appt-date">${escapeHtml(formatDate(appt.appointment_date))}</div>
                    <div class="appt-time">${escapeHtml(formatTime(appt.appointment_time))}</div>
                </div>
                <div class="appt-details">
                    <div class="appt-patient">${escapeHtml(appt.patient_name)}</div>
                    <div class="appt-meta">with Dr. ${escapeHtml(appt.doctor_name)}</div>
                    ${appt.reason ? `<div class="appt-meta">Reason: ${escapeHtml(appt.reason)}</div>` : ''}
                    ${appt.payment_status_display ? `<div class="appt-meta">Payment: ${escapeHtml(appt.payment_status_display)}</div>` : ''}
                    ${appt.status === 'CANCELLED' && appt.cancellation_reason
                        ? `<div class="appt-cancel-reason">Cancelled: ${escapeHtml(appt.cancellation_reason)}</div>`
                        : ''}
                </div>
                <div class="appt-actions">
                    <span class="appt-status-badge ${statusClass(appt.status)}">${escapeHtml(statusLabel)}</span>
                </div>
            </div>
        `;
    }

    document.getElementById('filterStatus').addEventListener('change', renderAll);
    document.getElementById('filterDoctor').addEventListener('change', renderAll);
    document.getElementById('filterDate').addEventListener('change', renderAll);

    document.getElementById('clearFiltersBtn').addEventListener('click', function () {
        document.getElementById('filterStatus').value = '';
        document.getElementById('filterDoctor').value = '';
        document.getElementById('filterDate').value = '';
        renderAll();
    });

    // =========================================================
    // INITIAL LOAD
    // =========================================================

    ClinicContext.init({
        selectId: 'clinicSelect',
        onSelect: loadData,
        onError: clinicListError
    });
</script>
</body>
</html>
