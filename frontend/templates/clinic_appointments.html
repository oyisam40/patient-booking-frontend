{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCONNECT - Doctors &amp; Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1B9AAA;
            min-height: 100vh;
        }
        .app-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1050;
        }
        .sidebar-toggle {
            background: none;
            border: none;
            font-size: 22px;
            color: #1B9AAA;
            cursor: pointer;
            padding: 4px 10px;
            margin-right: 12px;
        }
        .app-logo {
            font-weight: 700;
            color: #1B9AAA;
            font-size: 18px;
            margin-right: 20px;
        }
        .app-page-title {
            font-size: 16px;
            color: #555;
            font-weight: 600;
        }
        .app-sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 240px;
            height: calc(100vh - 60px);
            background: #fff;
            box-shadow: 2px 0 8px rgba(0,0,0,0.08);
            z-index: 1040;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .sidebar-links {
            padding: 20px 0;
        }
        .sidebar-link {
            display: block;
            padding: 12px 24px;
            color: #555;
            text-decoration: none;
            font-size: 15px;
            border-left: 3px solid transparent;
        }
        .sidebar-link:hover {
            background: #f4f7f8;
            color: #1B9AAA;
        }
        .sidebar-link.active {
            background: #eafaf9;
            color: #1B9AAA;
            border-left-color: #1B9AAA;
            font-weight: 600;
        }
        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid #eee;
        }
        .sidebar-logout {
            background: none;
            border: none;
            color: #c0392b;
            font-size: 15px;
            cursor: pointer;
            padding: 0;
        }
        .sidebar-logout:hover {
            color: #a93226;
            text-decoration: underline;
        }
        .app-content {
            margin-left: 240px;
            margin-top: 60px;
            padding: 40px 20px;
            transition: margin-left 0.3s ease;
        }
        body.sidebar-collapsed .app-sidebar {
            transform: translateX(-100%);
        }
        body.sidebar-collapsed .app-content {
            margin-left: 0;
        }

        .page-card {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .page-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .clinic-name-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 12px;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 12px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            min-width: 170px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 600;
            color: #777;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .result-count {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }

        .app-row {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 16px 22px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .appt-row:last-child {
            margin-bottom: 0;
        }

        .appt-when {
            min-width: 130px;
        }

        .appt-date {
            font-weight: 700;
            font-size: 14px;
        }

        .appt-time {
            color: #1B9AAA;
            font-weight: 600;
            font-size: 15px;
        }

        .appt-details {
            flex: 1;
        }

        .appt-patient {
            font-weight: 700;
            font-size: 16px;
        }

        .appt-meta {
            font-size: 13px;
            color: #888;
            margin-top: 2px;
        }

        .appt-cancel-reason {
            font-size: 13px;
            color: #c0392b;
            margin-top: 4px;
        }

        .appt-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .appt-status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-confirmed {
            background-color: #d4edda;
            color: #155724;
        }

        .status-completed {
            background-color: #d1ecf1;
            color: #0c5460;
        }

        .status-cancelled {
            background-color: #f8d7da;
            color: #721c24;
        }

        .btn-teal {
            background-color: #1B9AAA;
            border-color: #1B9AAA;
            color: white;
        }
        .btn-teal:hover {
            background-color: #16808f;
            border-color: #16808f;
            color: white;
        }

        .modal-backdrop-custom {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1050;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-backdrop-custom.open {
            display: flex;
        }

        .cancel-modal {
            background: #fff;
            border-radius: 12px;
            padding: 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.2);
        }

        .empty-state,
        .loading-state {
            text-align: center;
            color: #999;
            padding: 30px 0;
        }

        @media (max-width: 768px) {
            .appt-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .appt-actions {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
    <script src="{% static 'js/config.js' %}"></script>
</head>
<body>

    <header class="app-topbar">
        <button type="button" class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
        <span class="app-logo">DOCONNECT</span>
        <span class="app-page-title">Doctors &amp; Staff</span>
    </header>

    <!-- Clinic admin sidebar. Links to pages that aren't built yet use
         href="#" on purpose — a Django url tag pointing at a route that
         doesn't exist yet would crash this page with NoReverseMatch.
         Swap each "#" for a real url tag as that page gets built. -->
    <nav class="app-sidebar" id="appSidebar">
        <div class="sidebar-links">
            <a href="#" class="sidebar-link">Dashboard</a>
            <a href="{% url 'clinic_doctors_staff' %}" class="sidebar-link active">Doctors &amp; Staff</a>
            <a href="#" class="sidebar-link">Calendar</a>
            <a href="#" class="sidebar-link">Appointments &amp; Reports</a>
            <a href="#" class="sidebar-link">Clinic Settings</a>
            <a href="{% url 'notifications' %}" class="sidebar-link">Notifications</a>
        </div>
        <div class="sidebar-footer">
            <button type="button" class="sidebar-logout" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="app-content">
        <div class="page-card">
            <h1 class="h3 mb-1 font-weight-normal">Appointments</h1>
            <div class="clinic-name-label" id="clinicNameLabel"></div>

            <div class="filter-bar">
                <div class="filter-group">
                    <label for="filterStatus">Status</label>
                    <select id="filterStatus" class="form-select">
                        <option value="">All statuses</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterDoctor">Doctor</label>
                    <select id="filterDoctor" class="form-select">
                        <option value="">All doctors</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterDate">Date</label>
                    <input type="date" id="filterDate" class="form-control">
                </div>
                <button type="button" class="btn btn-outline-secondary" id="clearFiltersBtn">Clear filters</button>
            </div>
            <div class="result-count" id="resultCount"></div>

            <div class="loading-state" id="loadingState">Loading appointments...</div>
            <div class="empty-state" id="emptyState" style="display:none;"></div>
            <div id="appointmentList"></div>
        </div>
    </div>

    <div class="modal-backdrop-custom" id="cancelModalBackdrop">
        <div class="cancel-modal">
            <h5 class="mb-2">Cancel Appointment</h5>
            <p class="text-muted mb-3" id="cancelModalSummary" style="font-size: 14px;"></p>
            <textarea id="cancelReasonInput" class="form-control mb-2" rows="3" placeholder="Reason for cancelling (the patient will see this)"></textarea>
            <div class="text-danger mb-2" id="cancelReasonError" style="display:none;"></div>
            <div class="d-flex gap-2 mt-3">
                <button type="button" class="btn btn-outline-secondary w-100" id="cancelModalDismiss">Keep Appointment</button>
                <button type="button" class="btn btn-outline-danger w-100" id="cancelModalConfirm">Confirm Cancellation</button>
            </div>
        </div>
    </div>
<script>
    const token = localStorage.getItem('accessToken');

    document.getElementById('sidebarToggle').addEventListener('click', function () {
        document.body.classList.toggle('sidebar-collapsed');
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('refreshToken');
        window.location.href = "{% url 'home' %}";
    });

    // =========================================================
    // PLACEHOLDER DATA
    //
    // Ntsako's clinic endpoints don't exist yet, so everything
    // below stands in for real API calls.
    //
    // Built from fields that already exist on the real booking
    // endpoints (seen on the patient and doctor appointment pages):
    //   id, patient_name, doctor_name, appointment_date,
    //   appointment_time, status, status_display, reason
    // and the real Booking.Status values:
    //   PENDING_PAYMENT, PENDING_DOCTOR, CONFIRMED, CANCELLED, COMPLETED
    // Slots are fixed 1-hour slots (confirmed by Ntsako), so every
    // mock time is on the hour.
    //
    // STILL UNCONFIRMED (guessed below, flagged inline):
    //   - endpoint paths. Guessing GET /api/clinic/bookings/ for the
    //     list and PATCH /api/clinic/bookings/<id>/cancel/ with
    //     { reason }, mirroring the existing patient cancel endpoint.
    //     The clinic comes from the admin's token, not the URL.
    //   - whether a clinic admin may cancel at all, and from which
    //     statuses. Guessing the same three cancellable statuses the
    //     patient page uses.
    //   - what cancelling a PAID booking does. Payments go through
    //     Paystack, so a refund may depend on the clinic's cancellation
    //     policy (a clinic settings question).
    //   - "doctor" (the doctor's id) and "cancellation_reason" are
    //     guessed field names.
    //   - pagination and server-side filtering. This page filters in
    //     the browser, which is fine for mock data but won't hold up
    //     for a busy clinic. Real filters should become query params.
    //
    // TODO once login routing exists for CLINIC_ADMIN: redirect
    // anyone else away from this page. That redirect is UX only;
    // the backend must enforce access and clinic isolation.
    // =========================================================

    const MOCK_CLINIC = { id: 1, name: "Sandton Family Practice" };

    const MOCK_APPOINTMENTS = [
        { id: 101, patient_name: "Oyisa Mjali", doctor: 2, doctor_name: "Mihlali Kane", appointment_date: "2026-10-07", appointment_time: "09:00:00", status: "CONFIRMED", status_display: "Confirmed", reason: "Follow-up consultation", cancellation_reason: null },
        { id: 102, patient_name: "Khaya Mkhize", doctor: 1, doctor_name: "Lebo Rantao", appointment_date: "2026-10-07", appointment_time: "10:00:00", status: "PENDING_DOCTOR", status_display: "Pending doctor", reason: "Knee pain", cancellation_reason: null },
        { id: 103, patient_name: "Naledi Dube", doctor: 3, doctor_name: "Zanele Khumalo", appointment_date: "2026-10-07", appointment_time: "11:00:00", status: "CONFIRMED", status_display: "Confirmed", reason: "Child vaccination", cancellation_reason: null },
        { id: 104, patient_name: "Thabo Nkosi", doctor: 2, doctor_name: "Mihlali Kane", appointment_date: "2026-10-08", appointment_time: "14:00:00", status: "PENDING_PAYMENT", status_display: "Pending payment", reason: "Annual check-up", cancellation_reason: null },
        { id: 105, patient_name: "Oyisa Mjali", doctor: 1, doctor_name: "Lebo Rantao", appointment_date: "2026-10-05", appointment_time: "08:00:00", status: "COMPLETED", status_display: "Completed", reason: "Sports injury review", cancellation_reason: null },
        { id: 106, patient_name: "Khaya Mkhize", doctor: 2, doctor_name: "Mihlali Kane", appointment_date: "2026-10-06", appointment_time: "13:00:00", status: "CANCELLED", status_display: "Cancelled", reason: "Consultation", cancellation_reason: "Schedule conflict" },
        { id: 107, patient_name: "Naledi Dube", doctor: 1, doctor_name: "Lebo Rantao", appointment_date: "2026-10-09", appointment_time: "09:00:00", status: "CONFIRMED", status_display: "Confirmed", reason: "Back pain", cancellation_reason: null },
        { id: 108, patient_name: "Thabo Nkosi", doctor: 3, doctor_name: "Zanele Khumalo", appointment_date: "2026-10-05", appointment_time: "15:00:00", status: "COMPLETED", status_display: "Completed", reason: "Rash", cancellation_reason: null },
    ];

    const STATUS_OPTIONS = [
        { value: 'PENDING_PAYMENT', label: 'Pending payment' },
        { value: 'PENDING_DOCTOR', label: 'Pending doctor' },
        { value: 'CONFIRMED', label: 'Confirmed' },
        { value: 'COMPLETED', label: 'Completed' },
        { value: 'CANCELLED', label: 'Cancelled' },
    ];

    const CANCELLABLE_STATUSES = ['PENDING_PAYMENT', 'PENDING_DOCTOR', 'CONFIRMED'];

    let clinicName = '';
    let appointments = [];
    let cancelTargetId = null;

    // Names and reasons are typed in by users and end up inside
    // innerHTML below, so they are escaped first.
    function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
    }

    function formatDate(isoDate) {
        const d = new Date(isoDate + 'T00:00:00');
        return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    }

    function formatTime(timeValue) {
        return String(timeValue).slice(0, 5);
    }

    function statusClass(status) {
        if (status === 'CONFIRMED') return 'status-confirmed';
        if (status === 'COMPLETED') return 'status-completed';
        if (status === 'CANCELLED') return 'status-cancelled';
        return 'status-pending'; // PENDING_PAYMENT, PENDING_DOCTOR
    }

    // =========================================================
    // LOAD
    // =========================================================

    async function loadData() {
        // TODO: confirm with Ntsako: replace with:
        //   GET /api/clinic/me/        (this admin's clinic)
        //   GET /api/clinic/bookings/

        try {
            // Simulating a network call with mock data for now.
            await new Promise(resolve => setTimeout(resolve, 300));

            clinicName = MOCK_CLINIC.name;
            appointments = MOCK_APPOINTMENTS.map(a => Object.assign({}, a));

        } catch (error) {
            console.error(error);
            document.getElementById('loadingState').textContent = 'Could not load appointments.';
            return;
        }

        document.getElementById('loadingState').style.display = 'none';
        buildStatusFilter();
        buildDoctorFilter();
        renderAll();
    }

    function buildStatusFilter() {
        const select = document.getElementById('filterStatus');
        select.innerHTML = '<option value="">All statuses</option>' +
            STATUS_OPTIONS.map(s => `<option value="${s.value}">${s.label}</option>`).join('');
    }

    function buildDoctorFilter() {
        const select = document.getElementById('filterDoctor');
        const doctorNames = {};

        appointments.forEach(a => { doctorNames[a.doctor] = a.doctor_name; });

        const ids = Object.keys(doctorNames).sort((a, b) => doctorNames[a].localeCompare(doctorNames[b]));

        select.innerHTML = '<option value="">All doctors</option>' +
            ids.map(id => `<option value="${escapeHtml(id)}">Dr. ${escapeHtml(doctorNames[id])}</option>`).join('');
    }

    // =========================================================
    // FILTER + RENDER
    // =========================================================

    function getFilteredAppointments() {
        const status = document.getElementById('filterStatus').value;
        const doctor = document.getElementById('filterDoctor').value;
        const date = document.getElementById('filterDate').value;

        return appointments
            .filter(a => !status || a.status === status)
            .filter(a => !doctor || String(a.doctor) === doctor)
            .filter(a => !date || a.appointment_date === date)
            .sort((a, b) => (b.appointment_date + b.appointment_time).localeCompare(a.appointment_date + a.appointment_time));
    }

    function renderAll() {
        document.getElementById('clinicNameLabel').textContent = clinicName;

        const filtered = getFilteredAppointments();
        document.getElementById('resultCount').textContent =
            `Showing ${filtered.length} of ${appointments.length}`;

        renderList(filtered);
    }

    function renderList(filtered) {
        const container = document.getElementById('appointmentList');
        const emptyState = document.getElementById('emptyState');

        if (filtered.length === 0) {
            container.innerHTML = '';
            emptyState.textContent = appointments.length === 0
                ? 'No appointments yet.'
                : 'No appointments match these filters.';
            emptyState.style.display = 'block';
            return;
        }

        emptyState.style.display = 'none';
        container.innerHTML = filtered.map(appointmentRowHtml).join('');

        container.querySelectorAll('.cancel-btn').forEach(btn => {
            btn.addEventListener('click', () => openCancelModal(parseInt(btn.getAttribute('data-id'), 10)));
        });
    }

    function appointmentRowHtml(appt) {
        const canCancel = CANCELLABLE_STATUSES.includes(appt.status);
        const statusLabel = appt.status_display || appt.status;

        return `
            <div class="appt-row">
                <div class="appt-when">
                    <div class="appt-date">${escapeHtml(formatDate(appt.appointment_date))}</div>
                    <div class="appt-time">${escapeHtml(formatTime(appt.appointment_time))}</div>
                </div>
                <div class="appt-details">
                    <div class="appt-patient">${escapeHtml(appt.patient_name)}</div>
                    <div class="appt-meta">with Dr. ${escapeHtml(appt.doctor_name)}</div>
                    ${appt.reason ? `<div class="appt-meta">Reason: ${escapeHtml(appt.reason)}</div>` : ''}
                    ${appt.status === 'CANCELLED' && appt.cancellation_reason
                        ? `<div class="appt-cancel-reason">Cancelled: ${escapeHtml(appt.cancellation_reason)}</div>`
                        : ''}
                </div>
                <div class="appt-actions">
                    <span class="appt-status-badge ${statusClass(appt.status)}">${escapeHtml(statusLabel)}</span>
                    ${canCancel
                        ? `<button type="button" class="btn btn-sm btn-outline-danger cancel-btn" data-id="${appt.id}">Cancel</button>`
                        : ''}
                </div>
            </div>
        `;
    }

    document.getElementById('filterStatus').addEventListener('change', renderAll);
    document.getElementById('filterDoctor').addEventListener('change', renderAll);
    document.getElementById('filterDate').addEventListener('change', renderAll);

    document.getElementById('clearFiltersBtn').addEventListener('click', function () {
        document.getElementById('filterStatus').value = '';
        document.getElementById('filterDoctor').value = '';
        document.getElementById('filterDate').value = '';
        renderAll();
    });

    // =========================================================
    // CANCEL
    // =========================================================

    function openCancelModal(id) {
        const appt = appointments.find(a => a.id === id);
        if (!appt) return;

        cancelTargetId = id;
        document.getElementById('cancelModalSummary').textContent =
            `${appt.patient_name} with Dr. ${appt.doctor_name}, ${formatDate(appt.appointment_date)} at ${formatTime(appt.appointment_time)}`;
        document.getElementById('cancelReasonInput').value = '';
        document.getElementById('cancelReasonError').style.display = 'none';
        document.getElementById('cancelModalBackdrop').classList.add('open');
    }

    function closeCancelModal() {
        cancelTargetId = null;
        document.getElementById('cancelModalBackdrop').classList.remove('open');
    }

    document.getElementById('cancelModalDismiss').addEventListener('click', closeCancelModal);

    document.getElementById('cancelModalConfirm').addEventListener('click', async function () {
        const reason = document.getElementById('cancelReasonInput').value.trim();
        const errorEl = document.getElementById('cancelReasonError');

        if (!reason) {
            errorEl.textContent = 'A cancellation reason is required.';
            errorEl.style.display = 'block';
            return;
        }

        errorEl.style.display = 'none';

        const appt = appointments.find(a => a.id === cancelTargetId);
        if (!appt) {
            closeCancelModal();
            return;
        }

        // Only the network call lives inside the try. The UI updates
        // happen after it, so a bug in rendering can never be
        // reported to the user as a "network error".
        try {
            // TODO: confirm with Ntsako: replace with:
            //   PATCH /api/clinic/bookings/<id>/cancel/   { reason: "..." }
            // and only update the row if the response is OK.
            await new Promise(resolve => setTimeout(resolve, 200));

        } catch (error) {
            console.error(error);
            errorEl.textContent = 'Network error: could not cancel this appointment.';
            errorEl.style.display = 'block';
            return;
        }

        appt.status = 'CANCELLED';
        appt.status_display = 'Cancelled';
        appt.cancellation_reason = reason;

        closeCancelModal();
        renderAll();
    });

    // =========================================================
    // INITIAL LOAD
    // =========================================================

    loadData();
</script>
</body>
</html>
