{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCONNECT - Set Availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1B9AAA;
            min-height: 100vh;
        }
        .app-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1050;
        }
        .sidebar-toggle {
            background: none;
            border: none;
            font-size: 22px;
            color: #1B9AAA;
            cursor: pointer;
            padding: 4px 10px;
            margin-right: 12px;
        }
        .app-logo {
            font-weight: 700;
            color: #1B9AAA;
            font-size: 18px;
            margin-right: 20px;
        }
        .app-page-title {
            font-size: 16px;
            color: #555;
            font-weight: 600;
        }
        .app-sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 240px;
            height: calc(100vh - 60px);
            background: #fff;
            box-shadow: 2px 0 8px rgba(0,0,0,0.08);
            z-index: 1040;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .sidebar-links {
            padding: 20px 0;
        }
        .sidebar-link {
            display: block;
            padding: 12px 24px;
            color: #555;
            text-decoration: none;
            font-size: 15px;
            border-left: 3px solid transparent;
        }
        .sidebar-link:hover {
            background: #f4f7f8;
            color: #1B9AAA;
        }
        .sidebar-link.active {
            background: #eafaf9;
            color: #1B9AAA;
            border-left-color: #1B9AAA;
            font-weight: 600;
        }
        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid #eee;
        }
        .sidebar-logout {
            background: none;
            border: none;
            color: #c0392b;
            font-size: 15px;
            cursor: pointer;
            padding: 0;
        }
        .sidebar-logout:hover {
            color: #a93226;
            text-decoration: underline;
        }
        .app-content {
            margin-left: 240px;
            margin-top: 60px;
            padding: 40px 20px;
            transition: margin-left 0.3s ease;
        }
        body.sidebar-collapsed .app-sidebar {
            transform: translateX(-100%);
        }
        body.sidebar-collapsed .app-content {
            margin-left: 0;
        }
        .availability-card {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.1);
            padding: 40px;
        }
        .btn-teal {
            background-color: #1B9AAA;
            border-color: #1B9AAA;
            color: white;
        }
        .btn-teal:hover {
            background-color: #16808f;
            border-color: #16808f;
            color: white;
        }
        .slot-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f4f7f8;
            border-radius: 8px;
            padding: 10px 16px;
            margin-bottom: 8px;
        }
        .remove-slot {
            color: #dc3545;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
    <script src="{% static 'js/guard.js' %}" data-allow="DOCTOR"></script>
    <script src="{% static 'js/config.js' %}"></script>
</head>
<body>

    <header class="app-topbar">
        <button type="button" class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
        <span class="app-logo">DOCONNECT</span>
        <span class="app-page-title">Set Availability</span>
    </header>

    <nav class="app-sidebar" id="appSidebar">
        <div class="sidebar-links">
            <a href="{% url 'doctor_profile' %}" class="sidebar-link">Profile</a>
            <a href="{% url 'doctor_availability' %}" class="sidebar-link active">Set Availability</a>
            <a href="{% url 'doctor_appointments' %}" class="sidebar-link">My Appointments</a>
            <a href="{% url 'doctor_chat' %}" class="sidebar-link">Messages</a>
            <a href="{% url 'doctor_documents' %}" class="sidebar-link">Verification Documents</a>
            <a href="{% url 'notifications' %}" class="sidebar-link">Notifications</a>
        </div>
        <div class="sidebar-footer">
            <button type="button" class="sidebar-logout" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="app-content">
<div class="availability-card">
    <h1 class="h3 mb-4 text-center font-weight-normal">Set Your Availability</h1>
    <p class="text-muted text-center mb-4">Add the days and times you're available for appointments this week.</p>

    <div class="mb-3">
        <label class="form-label">Day of the Week</label>
        <select id="slotDay" class="form-control">
            <option value="">Select a day</option>
            <option value="0" data-name="MONDAY">Monday</option>
            <option value="1" data-name="TUESDAY">Tuesday</option>
            <option value="2" data-name="WEDNESDAY">Wednesday</option>
            <option value="3" data-name="THURSDAY">Thursday</option>
            <option value="4" data-name="FRIDAY">Friday</option>
            <option value="5" data-name="SATURDAY">Saturday</option>
            <option value="6" data-name="SUNDAY">Sunday</option>
        </select>
    </div>

    <div class="row mb-3">
        <div class="col">
            <label class="form-label">Start Time</label>
            <input type="time" id="startTime" class="form-control">
        </div>

        <div class="col">
            <label class="form-label">End Time</label>
            <input type="time" id="endTime" class="form-control">
        </div>
    </div>

    <div id="addSlotError" class="text-danger mb-3" style="display:none;"></div>

    <button type="button" id="addSlotBtn" class="btn btn-outline-secondary w-100 mb-4">+ Add Slot</button>

    <div id="slotList" class="mb-4">
        <p class="text-muted text-center" id="noSlotsText">No slots added yet.</p>
    </div>

    <div id="saveError" class="text-danger mb-3" style="display:none"></div>
    <div id="saveSuccess" class="text-success mb-3" style="display:none"></div>

    <div class="d-flex gap-2">
        <button type="button" id="saveSlotsBtn" class="btn btn-teal w-100">Save Availability</button>
    </div>
</div>
    </div>

<script>
    const token = localStorage.getItem('accessToken');
    let slots = [];

    document.getElementById('sidebarToggle').addEventListener('click', function () {
        document.body.classList.toggle('sidebar-collapsed');
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('refreshToken');
        window.location.href = "{% url 'home' %}";
    });

    function renderSlotList() {
        const slotList = document.getElementById('slotList');

        if (slots.length === 0) {
            slotList.innerHTML = '<p class="text-muted text-center" id="noSlotsText">No slots added yet.</p>';
            return;
        }

        slotList.innerHTML = slots.map((slot, index) => `
        <div class="slot-item">
            <span>${slot.day_name} &middot; ${slot.start_time} - ${slot.end_time}</span>
            <span class="remove-slot" data-index="${index}">&times;</span>
        </div>
        `).join('');

        document.querySelectorAll('.remove-slot').forEach(el => {
            el.addEventListener('click', function () {
                const index = parseInt(this.getAttribute('data-index'));
                slots.splice(index, 1);
                renderSlotList();
            });
        });
    }

    document.getElementById('addSlotBtn').addEventListener('click', function () {
        const daySelect = document.getElementById('slotDay');
        const dayOfWeek = daySelect.value;
        const dayName = daySelect.options[daySelect.selectedIndex].getAttribute('data-name');
        const startTime = document.getElementById('startTime').value;
        const endTime = document.getElementById('endTime').value;
        const addSlotError = document.getElementById('addSlotError');

        addSlotError.style.display = 'none';

        if (dayOfWeek === '' || !startTime || !endTime) {
            addSlotError.textContent = 'Please select a day, start time, and end time.';
            addSlotError.style.display = 'block';
            return;
        }

        if (startTime >= endTime) {
            addSlotError.textContent = 'End time must be after start time.';
            addSlotError.style.display = 'block';
            return;
        }

        slots.push({
            day_of_week: parseInt(dayOfWeek),
            day_name: dayName,
            start_time: startTime,
            end_time: endTime
        });
        renderSlotList();

        daySelect.value = '';
        document.getElementById('startTime').value = '';
        document.getElementById('endTime').value = '';
    });

    document.getElementById('saveSlotsBtn').addEventListener('click', async function () {
        const saveError = document.getElementById('saveError');
        const saveSuccess = document.getElementById('saveSuccess');
        saveError.style.display = 'none';
        saveSuccess.style.display = 'none';

        if (slots.length === 0) {
            saveError.textContent = 'Please add at least one slot before saving.';
            saveError.style.display = 'block';
            return;
        }

        try {
            let allSucceeded = true;
            let lastError = null;

            for (const slot of slots) {
                const response = await fetch(API_BASE_URL + '/api/doctors/doctor/availability/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        day_of_week: slot.day_of_week,
                        day_name: slot.day_name,
                        start_time: slot.start_time,
                        end_time: slot.end_time
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    allSucceeded = false;
                    lastError = data;
                }
            }

            if (allSucceeded) {
                saveSuccess.textContent = 'Availability saved successfully!';
                saveSuccess.style.display = 'block';
                slots = [];
                renderSlotList();
            } else {
                saveError.textContent = JSON.stringify(lastError);
                saveError.style.display = 'block';
            }
        } catch (error) {
            saveError.textContent = 'Network error: could not reach the server';
            saveError.style.display = 'block';
        }
    });
</script>
</body>
</html>
