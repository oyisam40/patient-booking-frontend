{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCONNECT - Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1B9AAA;
            min-height: 100vh;
        }
        .app-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1050;
        }
        .sidebar-toggle {
            background: none;
            border: none;
            font-size: 22px;
            color: #1B9AAA;
            cursor: pointer;
            padding: 4px 10px;
            margin-right: 12px;
        }
        .app-logo {
            font-weight: 700;
            color: #1B9AAA;
            font-size: 18px;
            margin-right: 20px;
        }
        .app-page-title {
            font-size: 16px;
            color: #555;
            font-weight: 600;
        }
        .app-sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 240px;
            height: calc(100vh - 60px);
            background: #fff;
            box-shadow: 2px 0 8px rgba(0,0,0,0.08);
            z-index: 1040;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .sidebar-links {
            padding: 20px 0;
        }
        .sidebar-link {
            display: block;
            padding: 12px 24px;
            color: #555;
            text-decoration: none;
            font-size: 15px;
            border-left: 3px solid transparent;
        }
        .sidebar-link:hover {
            background: #f4f7f8;
            color: #1B9AAA;
        }
        .sidebar-link.active {
            background: #eafaf9;
            color: #1B9AAA;
            border-left-color: #1B9AAA;
            font-weight: 600;
        }
        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid #eee;
        }
        .sidebar-logout {
            background: none;
            border: none;
            color: #c0392b;
            font-size: 15px;
            cursor: pointer;
            padding: 0;
        }
        .sidebar-logout:hover {
            color: #a93226;
            text-decoration: underline;
        }
        .app-content {
            margin-left: 240px;
            margin-top: 60px;
            padding: 40px 20px;
            transition: margin-left 0.3s ease;
        }
        body.sidebar-collapsed .app-sidebar {
            transform: translateX(-100%);
        }
        body.sidebar-collapsed .app-content {
            margin-left: 0;
        }
        .page-card {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.1);
            padding: 40px;
        }
        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-tab {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #ddd;
            background: #fff;
            color: #555;
            cursor: pointer;
            font-size: 14px;
        }
        .filter-tab.active {
            background-color: #1B9AAA;
            border-color: #1B9AAA;
            color: white;
        }
        .notification-row {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
            position: relative;
        }
        .notification-row:last-child {
            margin-bottom: 0;
        }
        .notification-row.unread {
            border-color: #1B9AAA;
            background-color: #f4fbfb;
        }
        .notification-title {
            font-weight: 700;
            margin-bottom: 4px;
        }
        .notification-message {
            color: #444;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .notification-meta {
            color: #999;
            font-size: 12px;
        }
        .unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #1B9AAA;
            display: inline-block;
            margin-right: 6px;
        }
        .btn-teal {
            background-color: #1B9AAA;
            border-color: #1B9AAA;
            color: white;
        }
        .btn-teal:hover {
            background-color: #16808f;
            border-color: #16808f;
            color: white;
        }
    </style>
    <script src="{% static 'js/config.js' %}"></script>
</head>
<body>

    <header class="app-topbar">
        <button type="button" class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
        <span class="app-logo">DOCONNECT</span>
        <span class="app-page-title">Notifications</span>
    </header>

    <nav class="app-sidebar" id="appSidebar">
        <div class="sidebar-links" id="sidebarLinks"></div>
        <div class="sidebar-footer">
            <button type="button" class="sidebar-logout" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="app-content">
<div class="page-card">
    <h1 class="h3 mb-4 text-center font-weight-normal">Notifications</h1>

    <div class="filter-tabs">
        <button class="filter-tab active" data-filter="ALL">All</button>
        <button class="filter-tab" data-filter="UNREAD">Unread</button>
    </div>

    <div class="text-center" id="loadingState">
        <p class="text-muted">Loading notifications...</p>
    </div>

    <div id="emptyState" class="text-center text-muted" style="display:none;">
        <p>No notifications yet.</p>
    </div>

    <div id="errorState" class="text-center text-danger" style="display:none;">
        Could not load notifications. Please try again later.
    </div>

    <div id="notificationsList"></div>
</div>
    </div>

<script>
    const token = localStorage.getItem('accessToken');
    const userRole = localStorage.getItem('userRole');
    let currentFilter = 'ALL';

    // CHANGED: sidebar links are now built dynamically based on the logged-in
    // user's role, since this page is shared across patients, doctors, and admins.
    // Falls back to the patient links if userRole isn't set (e.g. someone who
    // logged in before this change and hasn't logged in again since).
    function renderSidebarLinks() {
        const sidebarLinks = document.getElementById('sidebarLinks');

        if (userRole === 'DOCTOR') {
            sidebarLinks.innerHTML = `
                <a href="{% url 'doctor_profile' %}" class="sidebar-link">Profile</a>
                <a href="{% url 'doctor_availability' %}" class="sidebar-link">Set Availability</a>
                <a href="{% url 'doctor_appointments' %}" class="sidebar-link">My Appointments</a>
                <a href="{% url 'doctor_chat' %}" class="sidebar-link">Messages</a>
                <a href="{% url 'doctor_documents' %}" class="sidebar-link">Verification Documents</a>
                <a href="{% url 'notifications' %}" class="sidebar-link active">Notifications</a>
            `;
        } else if (userRole === 'ADMIN') {
            sidebarLinks.innerHTML = `
                <a href="{% url 'admin_dashboard' %}" class="sidebar-link">Dashboard</a>
                <a href="{% url 'admin_doctor_management' %}" class="sidebar-link">Manage Doctors</a>
                <a href="{% url 'admin_patient_management' %}" class="sidebar-link">Manage Patients</a>
                <a href="{% url 'admin_document_review' %}" class="sidebar-link">Document Review</a>
                <a href="{% url 'notifications' %}" class="sidebar-link active">Notifications</a>
            `;
        } else {
            // PATIENT (default/fallback)
            sidebarLinks.innerHTML = `
                <a href="{% url 'patient_profile' %}" class="sidebar-link">Profile</a>
                <a href="{% url 'patient_appointments' %}" class="sidebar-link">My Appointments</a>
                <a href="{% url 'symptom_checker' %}" class="sidebar-link">Symptom Checker</a>
                <a href="{% url 'browse_doctors' %}" class="sidebar-link">Find a Doctor</a>
                <a href="{% url 'patient_chat' %}" class="sidebar-link">Messages</a>
                <a href="{% url 'notifications' %}" class="sidebar-link active">Notifications</a>
            `;
        }
    }

    renderSidebarLinks();

    document.getElementById('sidebarToggle').addEventListener('click', function () {
        document.body.classList.toggle('sidebar-collapsed');
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('refreshToken');
        window.location.href = "{% url 'home' %}";
    });

    function formatDate(isoString) {
        const d = new Date(isoString);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
               ' at ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }

    function renderNotifications(notifications) {
        const list = document.getElementById('notificationsList');

        list.innerHTML = notifications.map(n => `
        <div class="notification-row ${n.is_read ? '' : 'unread'}" data-id="${n.id}">
            <div class="notification-title">
                ${n.is_read ? '' : '<span class="unread-dot"></span>'}${n.title}
            </div>
            <div class="notification-message">${n.message}</div>
            <div class="d-flex justify-content-between align-items-center">
                <span class="notification-meta">${formatDate(n.created_at)}</span>
                ${!n.is_read ? `<button class="btn btn-teal btn-sm mark-read-btn" data-id="${n.id}">Mark as read</button>` : ''}
            </div>
        </div>
        `).join('');

        document.querySelectorAll('.mark-read-btn').forEach(btn => {
            btn.addEventListener('click', () => markAsRead(btn.getAttribute('data-id')));
        });
    }

    async function loadNotifications(filter) {
        document.getElementById('loadingState').style.display = 'block';
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('errorState').style.display = 'none';
        document.getElementById('notificationsList').innerHTML = '';

        try {
            let url = API_BASE_URL + '/api/notifications/';
            if (filter === 'UNREAD') {
                url = API_BASE_URL + '/api/notifications/unread/';
            }

            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error('Failed to fetch notifications');
            }

            const data = await response.json();
            document.getElementById('loadingState').style.display = 'none';

            const results = data.notifications || [];

            if (results.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
            } else {
                renderNotifications(results);
            }
        } catch (error) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            console.error(error);
        }
    }

    async function markAsRead(id) {
        try {
            const response = await fetch(`${API_BASE_URL}/api/notifications/${id}/read/`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                loadNotifications(currentFilter);
            }
        } catch (error) {
            console.error(error);
        }
    }

    document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', function () {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.getAttribute('data-filter');
            loadNotifications(currentFilter);
        });
    });

    loadNotifications(currentFilter);
</script>
</body>
</html>
