{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCONNECT - Doctor Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1B9AAA;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .detail-card {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.1);
            padding: 40px;
        }
        .doctor-name {
            font-weight: 700;
        }
        .doctor-specialty {
            color: #1B9AAA;
            font-weight: 600;
        }
        .rating {
            color: #f5a623;
            font-weight: 600;
        }
        .slot-btn {
            border: 1px solid #1B9AAA;
            color: #1B9AAA;
            background: #fff;
            border-radius: 8px;
            padding: 8px 12px;
            margin: 4px;
            cursor: pointer;
        }
        .slot-btn.selected {
            background-color: #1B9AAA;
            color: white;
        }
        .btn-teal {
            background-color: #1B9AAA;
            border-color: #1B9AAA;
            color: white;
        }
        .btn-teal:hover {
            background-color: #16808f;
            border-color: #16808f;
            color: white;
        }
        .slot-hint {
            font-size: 0.85rem;
            color: #6c757d;
        }
        .top-bar {
            max-width: 600px;
            margin: 0 auto 16px auto;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }
        .top-bar a {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            text-decoration: none;
            background: #fff;
            color: #1B9AAA;
            border: 1px solid #fff;
        }
        .top-bar a:hover {
            background: #f4f7f8;
            color: #16808f;
        }
    </style>
    <script src="{% static 'js/config.js' %}"></script>
</head>
<body>

    <div class="top-bar">
        <a href="{% url 'browse_doctors' %}">&larr; Back to Find a Doctor</a>
    </div>

<div class="detail-card">
    <div class="text-center" id="loadingState">
        <p class="text-muted">Loading doctor details...</p>
    </div>

    <div id="detailContent" style="display:none;">
        <div class="text-center mb-4">
            <h2 class="doctor-name" id="doctorName"></h2>
            <div class="doctor-specialty" id="doctorSpecialty"></div>
            <div class="rating mt-1">&#9733; <span id="doctorRating"></span></div>
        </div>

        <p id="doctorBio" class="text-muted"></p>

        <hr class="my-4">

        <h5>Available Days</h5>
        <div id="slotsContainer">
            <p class="text-muted" id="noSlotsText" style="display:none;">No availability set for this doctor yet.</p>
            <div id="slotsGrid"></div>
            <p class="slot-hint mt-2" id="slotHint" style="display:none;"></p>
        </div>

        <div class="mb-3 mt-3">
            <label class="form-label">Appointment date</label>
            <input type="date" id="appointmentDate" class="form-control" disabled>
        </div>

        <div class="mb-3">
            <label class="form-label">Appointment time</label>
            <input type="time" id="appointmentTime" class="form-control" disabled>
        </div>

        <div class="mb-3">
            <label class="form-label">Reason for visit</label>
            <input type="text" id="bookingReason" class="form-control" placeholder="e.g. Follow-up consultation">
        </div>

        <div id="bookingError" class="text-danger mb-3" style="display:none;"></div>

        <button type="button" id="bookBtn" class="btn btn-teal w-100" disabled>Book Appointment</button>
    </div>

    <div id="errorState" style="display:none;" class="text-center text-danger">
        Could not load doctor details. Please try again later.
    </div>
</div>

<script>
    const token = localStorage.getItem('accessToken');
    const doctorId = window.location.pathname.split('/').filter(Boolean).pop();
    let selectedSlot = null;

    async function loadDoctorDetail() {
        try {
            const response = await fetch(`${API_BASE_URL}/api/doctors/doctors/${doctorId}/`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error('Failed to fetch doctor details');
            }

            const data = await response.json();

            document.getElementById('doctorName').textContent = `Dr. ${data.first_name} ${data.last_name}`;
            document.getElementById('doctorSpecialty').textContent = data.specialization;
            document.getElementById('doctorRating').textContent = data.rating || 'N/A';
            document.getElementById('doctorBio').textContent = data.bio || '';

            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('detailContent').style.display = 'block';

            loadAvailability();

        } catch (error) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            console.error(error);
        }
    }

    async function loadAvailability() {
        const slotsGrid = document.getElementById('slotsGrid');
        const noSlotsText = document.getElementById('noSlotsText');
        const slotHint = document.getElementById('slotHint');
        slotsGrid.innerHTML = '';
        noSlotsText.style.display = 'none';
        slotHint.style.display = 'none';
        selectedSlot = null;
        resetDateTimeInputs();
        document.getElementById('bookBtn').disabled = true;

        try {
            const response = await fetch(`${API_BASE_URL}/api/doctors/${doctorId}/availability/`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                noSlotsText.style.display = 'block';
                return;
            }

            const data = await response.json();
            const availability = data.availability || [];

            if (availability.length === 0) {
                noSlotsText.style.display = 'block';
                return;
            }

            slotsGrid.innerHTML = availability.map(slot => `
                <button type="button" class="slot-btn" data-day="${slot.day_of_week}" data-start="${slot.start_time}" data-end="${slot.end_time}" data-day-name="${slot.day_name}">
                    ${slot.day_name}: ${slot.start_time.slice(0,5)} - ${slot.end_time.slice(0,5)}
                </button>
            `).join('');

            document.querySelectorAll('.slot-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedSlot = {
                        day_of_week: this.getAttribute('data-day'),
                        start_time: this.getAttribute('data-start'),
                        end_time: this.getAttribute('data-end'),
                        day_name: this.getAttribute('data-day-name')
                    };
                    enableDateTimeInputs();
                    document.getElementById('bookBtn').disabled = false;
                });
            });

        } catch (error) {
            noSlotsText.style.display = 'block';
            console.error(error);
        }
    }

    function resetDateTimeInputs() {
        const dateInput = document.getElementById('appointmentDate');
        const timeInput = document.getElementById('appointmentTime');
        dateInput.value = '';
        timeInput.value = '';
        dateInput.disabled = true;
        timeInput.disabled = true;
        dateInput.removeAttribute('min');
        timeInput.removeAttribute('min');
        timeInput.removeAttribute('max');
    }

    function enableDateTimeInputs() {
        const dateInput = document.getElementById('appointmentDate');
        const timeInput = document.getElementById('appointmentTime');
        const slotHint = document.getElementById('slotHint');

        dateInput.disabled = false;
        timeInput.disabled = false;

        const todayStr = new Date().toISOString().split('T')[0];
        dateInput.min = todayStr;

        timeInput.min = selectedSlot.start_time.slice(0, 5);
        timeInput.max = selectedSlot.end_time.slice(0, 5);

        slotHint.textContent = `Pick a ${selectedSlot.day_name} on or after today, between ${selectedSlot.start_time.slice(0,5)} and ${selectedSlot.end_time.slice(0,5)}.`;
        slotHint.style.display = 'block';
    }

    // Converts a JS Date's getDay() (Sun=0..Sat=6) to backend convention (Mon=0..Sun=6)
    function toBackendDayOfWeek(jsDay) {
        return jsDay === 0 ? 6 : jsDay - 1;
    }

    document.getElementById('bookBtn').addEventListener('click', async function () {
        const bookingError = document.getElementById('bookingError');
        bookingError.style.display = 'none';

        const reason = document.getElementById('bookingReason').value;
        const dateValue = document.getElementById('appointmentDate').value;   // "YYYY-MM-DD"
        const timeValue = document.getElementById('appointmentTime').value;   // "HH:MM"

        if (!selectedSlot) {
            bookingError.textContent = 'Please select an available day.';
            bookingError.style.display = 'block';
            return;
        }

        if (!dateValue || !timeValue) {
            bookingError.textContent = 'Please choose a date and time.';
            bookingError.style.display = 'block';
            return;
        }

        const chosenDate = new Date(dateValue + 'T00:00:00');
        const backendDay = toBackendDayOfWeek(chosenDate.getDay());

        if (backendDay !== parseInt(selectedSlot.day_of_week)) {
            bookingError.textContent = `Selected date is not a ${selectedSlot.day_name}. Please pick a matching date.`;
            bookingError.style.display = 'block';
            return;
        }

        if (timeValue < selectedSlot.start_time.slice(0, 5) || timeValue > selectedSlot.end_time.slice(0, 5)) {
            bookingError.textContent = `Please pick a time between ${selectedSlot.start_time.slice(0,5)} and ${selectedSlot.end_time.slice(0,5)}.`;
            bookingError.style.display = 'block';
            return;
        }

        if (!reason.trim()) {
            bookingError.textContent = 'Please provide a reason for the visit.';
            bookingError.style.display = 'block';
            return;
        }

        try {
            const response = await fetch(API_BASE_URL + '/api/bookings/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    doctor: parseInt(doctorId),
                    appointment_date: dateValue,
                    appointment_time: timeValue + ':00',
                    reason: reason
                })
            });

            const data = await response.json();

            if (response.ok) {
                window.location.href = "{% url 'patient_profile' %}";
            } else {
                bookingError.textContent = JSON.stringify(data);
                bookingError.style.display = 'block';
            }
        } catch (error) {
            bookingError.textContent = 'Network error: could not reach the server';
            bookingError.style.display = 'block';
        }
    });

    loadDoctorDetail();
</script>
</body>
</html>
