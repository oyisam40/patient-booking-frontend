{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCONNECT - Document Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1B9AAA;
            min-height: 100vh;
        }
        .app-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1050;
        }
        .sidebar-toggle {
            background: none;
            border: none;
            font-size: 22px;
            color: #1B9AAA;
            cursor: pointer;
            padding: 4px 10px;
            margin-right: 12px;
        }
        .app-logo {
            font-weight: 700;
            color: #1B9AAA;
            font-size: 18px;
            margin-right: 20px;
        }
        .app-page-title {
            font-size: 16px;
            color: #555;
            font-weight: 600;
        }
        .app-sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 240px;
            height: calc(100vh - 60px);
            background: #fff;
            box-shadow: 2px 0 8px rgba(0,0,0,0.08);
            z-index: 1040;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .sidebar-links {
            padding: 20px 0;
        }
        .sidebar-link {
            display: block;
            padding: 12px 24px;
            color: #555;
            text-decoration: none;
            font-size: 15px;
            border-left: 3px solid transparent;
        }
        .sidebar-link:hover {
            background: #f4f7f8;
            color: #1B9AAA;
        }
        .sidebar-link.active {
            background: #eafaf9;
            color: #1B9AAA;
            border-left-color: #1B9AAA;
            font-weight: 600;
        }
        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid #eee;
        }
        .sidebar-logout {
            background: none;
            border: none;
            color: #c0392b;
            font-size: 15px;
            cursor: pointer;
            padding: 0;
        }
        .sidebar-logout:hover {
            color: #a93226;
            text-decoration: underline;
        }
        .app-content {
            margin-left: 240px;
            margin-top: 60px;
            padding: 24px;
            transition: margin-left 0.3s ease;
            height: calc(100vh - 60px);
        }
        body.sidebar-collapsed .app-sidebar {
            transform: translateX(-100%);
        }
        body.sidebar-collapsed .app-content {
            margin-left: 0;
        }

        .review-shell {
            max-width: 1200px;
            margin: 0 auto;
            height: 100%;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.1);
            display: flex;
            overflow: hidden;
        }

        .queue-list {
            width: 340px;
            border-right: 1px solid #eee;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .queue-list-header {
            padding: 20px;
            font-weight: 700;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .queue-count-badge {
            background: #eafaf9;
            color: #1B9AAA;
            font-size: 12px;
            font-weight: 700;
            border-radius: 10px;
            padding: 2px 10px;
        }

        .queue-item {
            padding: 14px 20px;
            border-bottom: 1px solid #f4f4f4;
            cursor: pointer;
        }

        .queue-item:hover {
            background: #f4fbfb;
        }

        .queue-item.active {
            background: #eafaf9;
            border-left: 3px solid #1B9AAA;
        }

        .queue-applicant-name {
            font-weight: 600;
            font-size: 14px;
        }

        .queue-meta {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }

        .queue-status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .queue-status-badge.submitted {
            background-color: #fff3cd;
            color: #856404;
        }

        .queue-status-badge.under_review {
            background-color: #d1ecf1;
            color: #0c5460;
        }

        .queue-status-badge.approved {
            background-color: #d4edda;
            color: #155724;
        }

        .queue-status-badge.rejected {
            background-color: #f8d7da;
            color: #721c24;
        }

        .detail-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .detail-header {
            padding: 20px 28px;
            border-bottom: 1px solid #eee;
        }

        .detail-applicant-name {
            font-weight: 700;
            font-size: 18px;
        }

        .detail-applicant-meta {
            color: #888;
            font-size: 13px;
            margin-top: 2px;
        }

        .detail-body {
            padding: 24px 28px;
        }

        .document-review-row {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }

        .document-review-row:last-child {
            margin-bottom: 0;
        }

        .document-review-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .document-review-name {
            font-weight: 600;
            font-size: 15px;
        }

        .document-view-link {
            font-size: 13px;
            color: #1B9AAA;
            text-decoration: none;
        }

        .document-view-link:hover {
            text-decoration: underline;
        }

        .document-review-status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .document-review-status-badge.pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .document-review-status-badge.approved {
            background-color: #d4edda;
            color: #155724;
        }

        .document-review-status-badge.rejected {
            background-color: #f8d7da;
            color: #721c24;
        }

        .document-review-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }

        .rejection-reason-box {
            display: none;
            margin-top: 12px;
        }

        .rejection-reason-box textarea {
            font-size: 13px;
        }

        .document-existing-reason {
            font-size: 13px;
            color: #c0392b;
            margin-top: 8px;
        }

        .application-actions-section {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .btn-teal {
            background-color: #1B9AAA;
            border-color: #1B9AAA;
            color: white;
        }
        .btn-teal:hover {
            background-color: #16808f;
            border-color: #16808f;
            color: white;
        }
        .btn-teal:disabled {
            background-color: #8fc7ce;
            border-color: #8fc7ce;
        }

        .empty-detail-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }

        .loading-state {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
    <script src="{% static 'js/config.js' %}"></script>
</head>
<body>

    <header class="app-topbar">
        <button type="button" class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
        <span class="app-logo">DOCONNECT</span>
        <span class="app-page-title">Document Review</span>
    </header>

    <nav class="app-sidebar" id="appSidebar">
        <div class="sidebar-links">
            <a href="{% url 'admin_dashboard' %}" class="sidebar-link">Dashboard</a>
            <a href="{% url 'admin_doctor_management' %}" class="sidebar-link">Manage Doctors</a>
            <a href="{% url 'admin_patient_management' %}" class="sidebar-link">Manage Patients</a>
            <a href="{% url 'admin_document_review' %}" class="sidebar-link active">Document Review</a>
            <a href="{% url 'notifications' %}" class="sidebar-link">Notifications</a>
        </div>
        <div class="sidebar-footer">
            <button type="button" class="sidebar-logout" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="app-content">
        <div class="review-shell">
            <div class="queue-list" id="queueList">
                <div class="queue-list-header">
                    <span>Applications</span>
                    <span class="queue-count-badge" id="queueCountBadge"></span>
                </div>
                <div class="loading-state" id="queueLoadingState">Loading applications...</div>
            </div>

            <div class="detail-panel" id="detailPanel">
                <div class="empty-detail-state" id="emptyDetailState">
                    Select an application to review its documents
                </div>

                <div id="activeDetail" style="display:none;">
                    <div class="detail-header">
                        <div class="detail-applicant-name" id="detailApplicantName"></div>
                        <div class="detail-applicant-meta" id="detailApplicantMeta"></div>
                    </div>

                    <div class="detail-body">
                        <div id="documentReviewList"></div>

                        <div class="application-actions-section">
                            <h6 class="mb-3">Application Decision</h6>
                            <div id="applicationActionError" class="text-danger mb-2" style="display:none; font-size: 13px;"></div>
                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-teal" id="approveApplicationBtn">Approve Application</button>
                                <button type="button" class="btn btn-outline-danger" id="rejectApplicationBtn">Reject Application</button>
                            </div>
                            <div class="rejection-reason-box" id="applicationRejectionBox">
                                <textarea class="form-control mb-2" id="applicationRejectionReason" rows="2" placeholder="Reason for rejecting the whole application..."></textarea>
                                <button type="button" class="btn btn-sm btn-outline-danger" id="confirmApplicationRejectBtn">Confirm Rejection</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary" id="cancelApplicationRejectBtn">Cancel</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    const token = localStorage.getItem('accessToken');

    document.getElementById('sidebarToggle').addEventListener('click', function () {
        document.body.classList.toggle('sidebar-collapsed');
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('refreshToken');
        window.location.href = "{% url 'home' %}";
    });


    //     PENDING | APPROVED | REJECTED
    // =========================================================

    let applicationQueue = [];
    let currentApplication = null; // full detail object once opened

    // =========================================================
    // LOAD QUEUE
    // =========================================================

    async function loadQueue() {
        try {
            const response = await fetch(`${API_BASE_URL}/api/verification/admin/applications/`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!response.ok) {
                throw new Error('Failed to load applications');
            }

            const data = await response.json();

            // TODO: confirm with Ntsako — assuming the response is
            // either a bare array, or an object with a "results" or
            // "applications" key. Handling all three shapes here.
            applicationQueue = data.applications || data.results || data;

            // FIXED — renderQueue() below wipes out everything inside
            // #queueList except the header, which means this loading
            // element only exists on the very first load. Every
            // subsequent call (e.g. after a reject/approve action
            // refreshes the queue) found it already gone and threw,
            // which the catch block below then wrongly reported as a
            // "network error" even though the actual request had
            // already succeeded. Guard with a null check so later
            // calls simply skip this since there's nothing to hide.
            const loadingEl = document.getElementById('queueLoadingState');
            if (loadingEl) {
                loadingEl.style.display = 'none';
            }

            renderQueue();

        } catch (error) {
            console.error(error);
            const loadingEl = document.getElementById('queueLoadingState');
            if (loadingEl) {
                loadingEl.textContent = 'Could not load applications. Please refresh.';
            } else {
                alert('Could not load applications. Please refresh the page.');
            }
        }
    }

    function renderQueue() {
        const list = document.getElementById('queueList');
        const header = list.querySelector('.queue-list-header');
        list.innerHTML = '';
        list.appendChild(header);

        document.getElementById('queueCountBadge').textContent = applicationQueue.length;

        applicationQueue.forEach(app => {
            const item = document.createElement('div');
            item.className = 'queue-item' + (currentApplication && app.id === currentApplication.id ? ' active' : '');

            const applicantName = app.doctor_name || app.applicant_name || 'Unknown applicant';
            const statusClass = (app.status || '').toLowerCase();

            item.innerHTML = `
                <div class="queue-applicant-name">${applicantName}</div>
                <div class="queue-meta">${formatDate(app.submitted_at || app.created_at)}</div>
                <span class="queue-status-badge ${statusClass}">${(app.status || '').replace('_', ' ')}</span>
            `;

            item.addEventListener('click', () => openApplication(app.id));
            list.appendChild(item);
        });
    }

    function formatDate(isoString) {
        if (!isoString) return '';
        const d = new Date(isoString);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // =========================================================
    // OPEN AN APPLICATION (fetches full detail)
    // =========================================================

    async function openApplication(applicationId) {
        try {
            const response = await fetch(
                `${API_BASE_URL}/api/verification/admin/applications/${applicationId}/`,
                { headers: { 'Authorization': `Bearer ${token}` } }
            );

            if (!response.ok) {
                throw new Error('Failed to load application detail');
            }

            const data = await response.json();


            currentApplication = data.application || data;

            document.getElementById('emptyDetailState').style.display = 'none';
            document.getElementById('activeDetail').style.display = 'block';

            renderQueue();
            renderApplicationDetail();

        } catch (error) {
            console.error(error);
            alert('Could not load this application. Please try again.');
        }
    }

    // =========================================================
    // RENDER APPLICATION DETAIL
    // =========================================================

    function renderApplicationDetail() {
        const app = currentApplication;
        if (!app) return;

        const applicantName = app.doctor_name || app.applicant_name || 'Unknown applicant';
        const applicantEmail = app.doctor_email || app.applicant_email || '';

        document.getElementById('detailApplicantName').textContent = applicantName;
        document.getElementById('detailApplicantMeta').textContent =
            `${applicantEmail} • Submitted ${formatDate(app.submitted_at || app.created_at)}`;

        const container = document.getElementById('documentReviewList');
        const documents = app.documents || [];

        container.innerHTML = documents.map(doc => {
            const statusClass = (doc.status || '').toLowerCase();

            // FIXED — doc.file is a relative path like
            // "/media/doctor_verification/IMG_...jpg", pointing at
            // the BACKEND's media folder. Without API_BASE_URL, the
            // browser resolves it against the frontend's own origin
            // (127.0.0.1:8081) instead, which 404s since the file
            // doesn't exist there.
            const rawFile = doc.file || doc.file_url || '';
            const fileUrl = rawFile ? `${API_BASE_URL}${rawFile}` : '#';

            return `
                <div class="document-review-row" data-doc-id="${doc.id}">
                    <div class="document-review-top">
                        <div>
                            <div class="document-review-name">${labelForType(doc.document_type)}</div>
                            <a href="${fileUrl}" target="_blank" class="document-view-link">View document &rarr;</a>
                        </div>
                        <span class="document-review-status-badge ${statusClass}">${doc.status}</span>
                    </div>

                    ${doc.status === 'REJECTED' && doc.rejection_reason ? `
                        <div class="document-existing-reason">Reason: ${doc.rejection_reason}</div>
                    ` : ''}

                    ${doc.status === 'PENDING' ? `
                        <div class="document-review-actions">
                            <button type="button" class="btn btn-sm btn-teal approve-doc-btn" data-doc-id="${doc.id}">Approve</button>
                            <button type="button" class="btn btn-sm btn-outline-danger reject-doc-btn" data-doc-id="${doc.id}">Reject</button>
                        </div>

                        <div class="rejection-reason-box" id="rejectionBox-${doc.id}">
                            <textarea class="form-control mb-2" id="rejectionReason-${doc.id}" rows="2" placeholder="Reason for rejecting this document..."></textarea>
                            <button type="button" class="btn btn-sm btn-outline-danger confirm-reject-doc-btn" data-doc-id="${doc.id}">Confirm Rejection</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary cancel-reject-doc-btn" data-doc-id="${doc.id}">Cancel</button>
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');

        attachDocumentActionListeners();
        updateApplicationActionState();
    }

    function labelForType(type) {
        const labels = {
            'ID_DOCUMENT': 'ID Document',
            'QUALIFICATION': 'Qualification Certificate',
            'MEDICAL_REGISTRATION': 'Medical Registration Proof',
        };
        return labels[type] || type;
    }

    // =========================================================
    // PER-DOCUMENT APPROVE / REJECT
    // =========================================================

    function attachDocumentActionListeners() {
        document.querySelectorAll('.approve-doc-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                approveDocument(this.getAttribute('data-doc-id'));
            });
        });

        document.querySelectorAll('.reject-doc-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const docId = this.getAttribute('data-doc-id');
                document.getElementById(`rejectionBox-${docId}`).style.display = 'block';
            });
        });

        document.querySelectorAll('.cancel-reject-doc-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const docId = this.getAttribute('data-doc-id');
                document.getElementById(`rejectionBox-${docId}`).style.display = 'none';
            });
        });

        document.querySelectorAll('.confirm-reject-doc-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const docId = this.getAttribute('data-doc-id');
                const reasonInput = document.getElementById(`rejectionReason-${docId}`);
                const reason = reasonInput.value.trim();

                if (!reason) {
                    alert('Please provide a reason for rejecting this document.');
                    return;
                }

                rejectDocument(docId, reason);
            });
        });
    }

    async function approveDocument(docId) {
        try {
            const response = await fetch(
                `${API_BASE_URL}/api/verification/admin/applications/${currentApplication.id}/documents/${docId}/approve/`,
                {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                }
            );

            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                alert(data.detail || 'Could not approve this document.');
                return;
            }

            await openApplication(currentApplication.id);

        } catch (error) {
            console.error(error);
            alert('Network error: could not approve this document.');
        }
    }

    async function rejectDocument(docId, reason) {
        try {
            const response = await fetch(
                `${API_BASE_URL}/api/verification/admin/applications/${currentApplication.id}/documents/${docId}/reject/`,
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },

                    body: JSON.stringify({ rejection_reason: reason })
                }
            );

            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                alert(data.detail || 'Could not reject this document.');
                return;
            }

            await openApplication(currentApplication.id);

        } catch (error) {
            console.error(error);
            alert('Network error: could not reject this document.');
        }
    }

    // =========================================================
    // WHOLE-APPLICATION APPROVE / REJECT

    function getLatestDocumentsByType(documents) {
        const latestByType = {};

        documents.forEach(doc => {
            const existing = latestByType[doc.document_type];
            if (!existing) {
                latestByType[doc.document_type] = doc;
                return;
            }
            const existingKey = existing.uploaded_at ? new Date(existing.uploaded_at).getTime() : existing.id;
            const docKey = doc.uploaded_at ? new Date(doc.uploaded_at).getTime() : doc.id;
            if (docKey > existingKey) {
                latestByType[doc.document_type] = doc;
            }
        });

        return Object.values(latestByType);
    }

    function updateApplicationActionState() {
        const app = currentApplication;
        const approveBtn = document.getElementById('approveApplicationBtn');
        const errorBox = document.getElementById('applicationActionError');

        const documents = app.documents || [];
        const latestDocuments = getLatestDocumentsByType(documents);
        const allApproved = latestDocuments.length > 0 && latestDocuments.every(d => d.status === 'APPROVED');

        approveBtn.disabled = !allApproved;

        if (!allApproved) {
            errorBox.textContent = 'All documents must be approved before the application can be approved.';
            errorBox.style.display = 'block';
        } else {
            errorBox.style.display = 'none';
        }
    }

    document.getElementById('approveApplicationBtn').addEventListener('click', async function () {
        try {
            const response = await fetch(
                `${API_BASE_URL}/api/verification/admin/applications/${currentApplication.id}/approve/`,
                {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                }
            );

            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                alert(data.detail || 'Could not approve this application.');
                return;
            }

            currentApplication = null;
            document.getElementById('activeDetail').style.display = 'none';
            document.getElementById('emptyDetailState').style.display = 'flex';

            await loadQueue();

        } catch (error) {
            console.error(error);
            alert('Network error: could not approve this application.');
        }
    });

    document.getElementById('rejectApplicationBtn').addEventListener('click', function () {
        document.getElementById('applicationRejectionBox').style.display = 'block';
    });

    document.getElementById('cancelApplicationRejectBtn').addEventListener('click', function () {
        document.getElementById('applicationRejectionBox').style.display = 'none';
    });

    document.getElementById('confirmApplicationRejectBtn').addEventListener('click', async function () {
        const reasonInput = document.getElementById('applicationRejectionReason');
        const reason = reasonInput.value.trim();

        if (!reason) {
            alert('Please provide a reason for rejecting this application.');
            return;
        }

        try {
            const response = await fetch(
                `${API_BASE_URL}/api/verification/admin/applications/${currentApplication.id}/reject/`,
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    // Same field name as the document-level reject
                    // ("rejection_reason", confirmed via its 400
                    // error) — not yet independently confirmed for
                    // this specific endpoint, but matches his
                    // naming convention on the returned object too.
                    body: JSON.stringify({ rejection_reason: reason })
                }
            );

            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                alert(data.detail || 'Could not reject this application.');
                return;
            }

            currentApplication = null;
            document.getElementById('activeDetail').style.display = 'none';
            document.getElementById('emptyDetailState').style.display = 'flex';

            await loadQueue();

        } catch (error) {
            console.error(error);
            alert('Network error: could not reject this application.');
        }
    });


    // INITIAL LOAD


    loadQueue();
</script>
</body>
</html>
