{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCONNECT - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg {
            animation: slide 3s ease-in-out infinite alternate;
            background-image: linear-gradient(-60deg, #1B9AAA 50%, #4FD1C5 50%);
            bottom: 0;
            left: -50%;
            opacity: .5;
            position: fixed;
            right: -50%;
            top: 0;
            z-index: -1;
        }

        .bg2 {
            animation-direction: alternate-reverse;
            animation-duration: 5s;
        }

        .bg3 {
            animation-duration: 6s;
        }

        @keyframes slide {
            0% { transform: translateX(-25%); }
            100% {transform: translateX(25%); }
        }
        body {
            min-height: 100vh;
        }

        .btn-teal {
            background-color: #1B9AAA;
            border-color: #1B9AAA;
            color: white;
        }
        .btn-teal:hover {
            background-color: #16808f;
            border-color: #16808f;
            color: white;
        }

        .forgot-link {
            color: #1B9AAA;
            text-decoration: none;
        }
        .forgot-link:hover {
            color: #16808f;
            text-decoration: underline;
        }

        input[type="email"],
        input[type="password"] {
            border-radius: 0.375rem;
        }
    </style>
</head>
<body>

<div class="bg"></div>
<div class="bg bg2"></div>
<div class="bg bg3"></div>
    <div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card" style="max-width: 520px; width: 100%; margin: 1rem; box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.25);">

            <div class="card-body p-4 text-center">
                <img class="mt-4 mb-4" src="{% static 'images/Doconnect.jpg' %}" height="115" alt="DoConnect Logo">

                <h1 class="h3 mb-3 font-weight-normal">Create An Account</h1>

                <form method="post" novalidate>
                    <div class="mb-3">
                        <input type="text" id="firstName" name="first_name" class="form-control mx-auto" style="max-width: 320px;" placeholder="First Name" required autofocus>
                    </div>
                    <div class="mb-3">
                        <input type="text" id="lastName" name="last_name" class="form-control mx-auto" style="max-width: 320px;" placeholder="Last Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" id="emailAddress" name="email" class="form-control mx-auto" style="max-width: 320px;" placeholder="Email Address" required>
                    </div>

                    <div class="mb-3">
                        <input type="text" id="idNumber" name="id_number" class="form-control mx-auto" style="max-width: 320px;" placeholder="ID Number" pattern="\d{13}" maxlength="13" required>
                    </div>

                    <div class="mb-3">
                        <input type="date" id="dateOfBirth" class="form-control mx-auto" style="max-width: 320px;" required>
                    </div>

                    <div class="mb-3">
                            <select id="gender" class="form-control mx-auto" style="max-width: 320px;" required>
                                <option value="" disabled selected>Gender</option>
                                <option value="MALE">Male</option>
                                <option value="FEMALE">Female</option>
                                <option value="OTHER">Other</option>
                            </select>
                    </div>

                    <div class="mb-3">
                        <input type="tel" id="phoneNumber" name="phone_number" class="form-control mx-auto" style="max-width: 320px;" placeholder="Phone Number" required>
                    </div>

                    <div class="mb-3 text-start mx-auto" style="max-width: 320px;">
                            <label class="form-label d-block text-center mb-2">Preferred Notification Method</label>
                            <div class="d-flex justify-content-center gap-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="notification_preference" id="notifyEmail" value="EMAIL" checked>
                                    <label class="form-check-label" for="notifyEmail">
                                        Email
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="notification_preference" id="notifySMS" value="SMS">
                                    <label class="form-check-label" for="notifySMS">
                                        SMS
                                    </label>
                                </div>
                            </div>
                        </div>

                     <div class="mb-3">
                        <input type="text" id="homeAddress" class="form-control mx-auto" style="max-width: 320px;" placeholder="Home Address" required>
                    </div>

                    <div class="mb-3">
                        <input type="text" id="emergencyContactName" class="form-control mx-auto" style="max-width: 320px;" placeholder="Emergency Contact Name" required>
                    </div>

                    <div class="mb-3">
                        <input type="tel" id="emergencyContactNumber" class="form-control mx-auto" style="max-width: 320px;" placeholder="Emergency Contact Number" required>
                    </div>

                    <div class="mb-3">
                        <input type="password" id="password" name="password" placeholder="Password" class="form-control mx-auto" style="max-width: 320px;">
                    </div>

                    <div class="mb-3">
                         <input type="password" id="confirmPassword" name="confirm_password" class="form-control mx-auto" style="max-width: 320px;" placeholder="Confirm Password" required>
                    </div>

                    <div class="mb-4">
                        <a href="{% url 'home' %}" class="forgot-link">Already have an account ? Sign in</a>
                    </div>

                    <div class="mb-4">
                        <button class="btn btn-teal mx-auto d-block" style="max-width: 320px; width: 100%;">Register</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const registerForm = document.querySelector('form');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');

    function checkPasswordsMatch() {
        if (password.value !== confirmPassword.value) {
            confirmPassword.setCustomValidity('Passwords do not match');
        } else {
            confirmPassword.setCustomValidity('');
        }
    }

    password.addEventListener('input', checkPasswordsMatch);
    confirmPassword.addEventListener('input', checkPasswordsMatch);

    registerForm.addEventListener('submit', async function (event) {
        event.preventDefault();
        checkPasswordsMatch();
        if (!registerForm.checkValidity()) {
            registerForm.classList.add('was-validated');
            return
        }
        const payload = {
            first_name: document.getElementById('firstName').value,
            last_name: document.getElementById('lastName').value,
            username: document.getElementById('emailAddress').value,
            email: document.getElementById('emailAddress').value,
            phone_number: document.getElementById('phoneNumber').value,
            password: password.value,
            confirm_password: confirmPassword.value,
            role: "PATIENT",
            id_number: document.getElementById('idNumber').value,
            address: document.getElementById('homeAddress').value,
            emergency_contact_name: document.getElementById('emergencyContactName').value,
            emergency_contact_phone: document.getElementById('emergencyContactNumber').value,
            verification_method: document.querySelector('input[name="notification_preference"]:checked').value,
            date_of_birth: document.getElementById('dateOfBirth').value,
            gender: document.getElementById('gender').value,
        };
    try {
        const response = await fetch('http://127.0.0.1:8000/api/auth/register/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (response.ok) {
            sessionStorage.setItem('pendingVerificationEmail', document.getElementById('emailAddress').value)
            window.location.href ="{% url 'verify_otp' %}"
        } else {
            alert(JSON.stringify(data))
        }
    } catch (error) {
        alert("Network error: could not reach the server")
    }
    });
    </script>
</body>
</html>
