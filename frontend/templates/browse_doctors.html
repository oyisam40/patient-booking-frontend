{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCONNECT - Find a Doctor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1B9AAA;
            min-height: 100vh;
        }
        .app-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1050;
        }
        .sidebar-toggle {
            background: none;
            border: none;
            font-size: 22px;
            color: #1B9AAA;
            cursor: pointer;
            padding: 4px 10px;
            margin-right: 12px;
        }
        .app-logo {
            font-weight: 700;
            color: #1B9AAA;
            font-size: 18px;
            margin-right: 20px;
        }
        .app-page-title {
            font-size: 16px;
            color: #555;
            font-weight: 600;
        }
        .app-sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 240px;
            height: calc(100vh - 60px);
            background: #fff;
            box-shadow: 2px 0 8px rgba(0,0,0,0.08);
            z-index: 1040;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .sidebar-links {
            padding: 20px 0;
        }
        .sidebar-link {
            display: block;
            padding: 12px 24px;
            color: #555;
            text-decoration: none;
            font-size: 15px;
            border-left: 3px solid transparent;
        }
        .sidebar-link:hover {
            background: #f4f7f8;
            color: #1B9AAA;
        }
        .sidebar-link.active {
            background: #eafaf9;
            color: #1B9AAA;
            border-left-color: #1B9AAA;
            font-weight: 600;
        }
        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid #eee;
        }
        .sidebar-logout {
            background: none;
            border: none;
            color: #c0392b;
            font-size: 15px;
            cursor: pointer;
            padding: 0;
        }
        .sidebar-logout:hover {
            color: #a93226;
            text-decoration: underline;
        }
        .app-content {
            margin-left: 240px;
            margin-top: 60px;
            padding: 40px 20px;
            transition: margin-left 0.3s ease;
        }
        body.sidebar-collapsed .app-sidebar {
            transform: translateX(-100%);
        }
        body.sidebar-collapsed .app-content {
            margin-left: 0;
        }
        .page-card {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.1);
            padding: 40px;
        }
        .doctor-row {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .doctor-row:last-child {
            margin-bottom: 0;
        }
        .doctor-name {
            font-weight: 700;
        }
        .doctor-specialty {
            color: #1B9AAA;
            font-size: 14px;
        }
        .rating {
            color: #f5a623;
            font-weight: 600;
        }
        .btn-teal {
            background-color: #1B9AAA;
            border-color: #1B9AAA;
            color: white;
        }
        .btn-teal:hover {
            background-color: #16808f;
            border-color: #16808f;
            color: white;
        }
    </style>
    <script src="{% static 'js/guard.js' %}" data-allow="PATIENT"></script>
    <script src="{% static 'js/config.js' %}"></script>
</head>
<body>

    <header class="app-topbar">
        <button type="button" class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
        <span class="app-logo">DOCONNECT</span>
        <span class="app-page-title">Find a Doctor</span>
    </header>

    <nav class="app-sidebar" id="appSidebar">
        <div class="sidebar-links">
            <a href="{% url 'patient_profile' %}" class="sidebar-link">Profile</a>
            <a href="{% url 'patient_appointments' %}" class="sidebar-link">My Appointments</a>
            <a href="{% url 'symptom_checker' %}" class="sidebar-link">Symptom Checker</a>
            <a href="{% url 'browse_doctors' %}" class="sidebar-link active">Find a Doctor</a>
             <a href="{% url 'patient_chat' %}" class="sidebar-link">Messages</a>
            <a href="{% url 'notifications' %}" class="sidebar-link">Notifications</a>
        </div>
        <div class="sidebar-footer">
            <button type="button" class="sidebar-logout" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="app-content">
<div class="page-card">
    <h1 class="h3 mb-4 text-center font-weight-normal">Find a Doctor</h1>

    <div id="filterBanner" class="alert alert-info justify-content-between align-items-center" style="display:none;">
        <span id="filterBannerText"></span>
        <a href="{% url 'browse_doctors' %}" class="btn btn-sm btn-outline-secondary">Clear filter</a>
    </div>

    <div class="mb-3">
        <label class="form-label" for="clinicFilter">Clinic</label>
        <select id="clinicFilter" class="form-control">
            <option value="">Select a clinic...</option>
        </select>
    </div>

    <div class="mb-4">
        <select id="specialtyFilter" class="form-control">
            <option value="">All Specialties</option>
            <option value="general_practice">General Practice</option>
            <option value="pediatrics">Pediatrics</option>
            <option value="cardiology">Cardiology</option>
            <option value="dermatology">Dermatology</option>
            <option value="psychiatry">Psychiatry</option>
            <option value="orthopedics">Orthopedics</option>
            <option value="gynecology">Gynecology</option>
            <option value="dentistry">Dentistry</option>
            <option value="other">Other</option>
        </select>
    </div>

    <div id="clinicPrompt" class="text-center text-muted" style="display:none;">
        <p>Choose a clinic to see its doctors.</p>
    </div>

    <div class="text-center" id="loadingState" style="display:none;">
        <p class="text-muted">Loading doctors...</p>
    </div>

    <div id="emptyState" class="text-center text-muted" style="display:none;">
        <p id="emptyStateText">No doctors found.</p>
    </div>

    <div id="errorState" class="text-center text-danger" style="display:none;">
        Could not load doctors. Please try again later.
    </div>

    <div id="doctorList"></div>
</div>
    </div>

<script>
    document.getElementById('sidebarToggle').addEventListener('click', function () {
        document.body.classList.toggle('sidebar-collapsed');
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('refreshToken');
        window.location.href = "{% url 'home' %}";
    });

    // The patient picks a clinic first. Only that clinic's doctors are
    // loaded (GET /api/clinics/{id}/doctors/), so a doctor from another
    // clinic can never be shown or carried over when the clinic changes.
    let clinicDoctors = [];   // doctors of the selected clinic, kept so the specialty filter needs no new request
    let selectedClinicId = '';

    // Names are typed in by users and end up inside innerHTML below,
    // so they are escaped first.
    function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
    }

    // "General Practice", "general-practice" and "general_practice" all compare equal.
    function normalizeSpecialty(value) {
        return String(value || '').trim().toLowerCase().replace(/[\s-]+/g, '_');
    }

    function rememberClinic(id) {
        try { sessionStorage.setItem('selectedClinicId', id); } catch (e) { /* storage unavailable: ignore */ }
    }

    function recallClinic() {
        try { return sessionStorage.getItem('selectedClinicId') || ''; } catch (e) { return ''; }
    }

    function setState(state) {
        document.getElementById('clinicPrompt').style.display = state === 'prompt' ? 'block' : 'none';
        document.getElementById('loadingState').style.display = state === 'loading' ? 'block' : 'none';
        document.getElementById('emptyState').style.display = state === 'empty' ? 'block' : 'none';
        document.getElementById('errorState').style.display = state === 'error' ? 'block' : 'none';
        if (state !== 'list') {
            document.getElementById('doctorList').innerHTML = '';
        }
    }

    function showError(message) {
        setState('error');
        document.getElementById('errorState').textContent = message;
    }

    async function loadClinics() {
        setState('loading');
        let clinics;

        try {
            const token = localStorage.getItem('accessToken');
            const response = await fetch(API_BASE_URL + '/api/clinics/', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error('Failed to fetch clinics');
            }

            const data = await response.json();
            clinics = data.clinics || data.results || data;
        } catch (error) {
            console.error(error);
            showError('Could not load clinics. Please try again later.');
            return;
        }

        if (!Array.isArray(clinics)) {
            showError('Could not load clinics. Please try again later.');
            return;
        }

        clinics = clinics.filter(c => c.is_active !== false);

        const select = document.getElementById('clinicFilter');
        select.innerHTML = '<option value="">Select a clinic...</option>' +
            clinics.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join('');

        if (clinics.length === 0) {
            setState('empty');
            document.getElementById('emptyStateText').textContent = 'No clinics are available yet.';
            return;
        }

        // Pick a clinic automatically: the one in the URL, else the one
        // remembered from earlier, else the only one there is.
        const fromUrl = new URLSearchParams(window.location.search).get('clinic') || '';
        const candidates = [fromUrl, recallClinic()];
        let chosen = candidates.find(id => id && clinics.some(c => String(c.id) === String(id))) || '';

        if (!chosen && clinics.length === 1) {
            chosen = String(clinics[0].id);
        }

        if (chosen) {
            select.value = chosen;
            rememberClinic(chosen);
            loadClinicDoctors(chosen);
        } else {
            setState('prompt');
        }
    }

    async function loadClinicDoctors(clinicId) {
        selectedClinicId = String(clinicId);
        clinicDoctors = [];
        setState('loading');

        let doctors;

        try {
            const token = localStorage.getItem('accessToken');
            const response = await fetch(`${API_BASE_URL}/api/clinics/${clinicId}/doctors/`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error('Failed to fetch doctors');
            }

            const data = await response.json();
            doctors = data.doctors || data.results || data;

        } catch (error) {
            console.error(error);
            if (selectedClinicId === String(clinicId)) {
                showError('Could not load doctors. Please try again later.');
            }
            return;
        }

        // The patient may have switched clinic while this request was
        // running. Ignore the late answer so it can't overwrite the list.
        if (selectedClinicId !== String(clinicId)) {
            return;
        }

        clinicDoctors = Array.isArray(doctors) ? doctors : [];
        applySpecialtyFilter();
    }

    // The clinic doctors endpoint has no specialty parameter, so the
    // filter runs here on the doctors already loaded.
    function applySpecialtyFilter() {
        if (!selectedClinicId) {
            return;
        }

        const specialty = document.getElementById('specialtyFilter').value;
        const filtered = specialty
            ? clinicDoctors.filter(d => normalizeSpecialty(d.specialization) === normalizeSpecialty(specialty))
            : clinicDoctors;

        if (filtered.length === 0) {
            setState('empty');
            document.getElementById('emptyStateText').textContent = clinicDoctors.length === 0
                ? 'This clinic has no available doctors yet.'
                : 'No doctors at this clinic match that specialty.';
            return;
        }

        setState('list');
        renderDoctors(filtered);
    }

    function renderDoctors(doctors) {
        const list = document.getElementById('doctorList');

        list.innerHTML = doctors.map(doc => `
        <div class="doctor-row">
            <div>
                <div class="doctor-name">Dr. ${escapeHtml(doc.name || `${doc.first_name || ''} ${doc.last_name || ''}`.trim())}</div>
                <div class="doctor-specialty">${escapeHtml(doc.specialization || '')}</div>
            </div>
            <div class="text-end">
                ${doc.id !== undefined
                    ? `<a href="/doctors/${encodeURIComponent(doc.id)}/?clinic=${encodeURIComponent(selectedClinicId)}" class="btn btn-teal btn-sm mt-1">View Profile</a>`
                    : `<span class="text-muted small">Profile unavailable</span>`}
            </div>
        </div>
        `).join('');
    }

    document.getElementById('clinicFilter').addEventListener('change', function () {
        if (!this.value) {
            selectedClinicId = '';
            clinicDoctors = [];
            setState('prompt');
            return;
        }

        rememberClinic(this.value);
        loadClinicDoctors(this.value);
    });

    document.getElementById('specialtyFilter').addEventListener('change', applySpecialtyFilter);

    document.addEventListener('DOMContentLoaded', function () {
        // Coming from the symptom checker: ?specialty=<code> pre-selects
        // the specialty and shows the banner.
        const specialtyParam = new URLSearchParams(window.location.search).get('specialty');

        if (specialtyParam) {
            const select = document.getElementById('specialtyFilter');
            const matchingOption = select.querySelector(`option[value="${specialtyParam}"]`);

            if (matchingOption) {
                select.value = specialtyParam;

                document.getElementById('filterBannerText').textContent =
                    `Showing ${matchingOption.textContent} based on your symptoms`;
                document.getElementById('filterBanner').style.display = 'flex';
            }
        }

        loadClinics();
    });
</script>
</body>
</html>
