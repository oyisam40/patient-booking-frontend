{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCONNECT - Find a Doctor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1B9AAA;
            min-height: 100vh;
        }
        .app-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1050;
        }
        .sidebar-toggle {
            background: none;
            border: none;
            font-size: 22px;
            color: #1B9AAA;
            cursor: pointer;
            padding: 4px 10px;
            margin-right: 12px;
        }
        .app-logo {
            font-weight: 700;
            color: #1B9AAA;
            font-size: 18px;
            margin-right: 20px;
        }
        .app-page-title {
            font-size: 16px;
            color: #555;
            font-weight: 600;
        }
        .app-sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 240px;
            height: calc(100vh - 60px);
            background: #fff;
            box-shadow: 2px 0 8px rgba(0,0,0,0.08);
            z-index: 1040;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .sidebar-links {
            padding: 20px 0;
        }
        .sidebar-link {
            display: block;
            padding: 12px 24px;
            color: #555;
            text-decoration: none;
            font-size: 15px;
            border-left: 3px solid transparent;
        }
        .sidebar-link:hover {
            background: #f4f7f8;
            color: #1B9AAA;
        }
        .sidebar-link.active {
            background: #eafaf9;
            color: #1B9AAA;
            border-left-color: #1B9AAA;
            font-weight: 600;
        }
        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid #eee;
        }
        .sidebar-logout {
            background: none;
            border: none;
            color: #c0392b;
            font-size: 15px;
            cursor: pointer;
            padding: 0;
        }
        .sidebar-logout:hover {
            color: #a93226;
            text-decoration: underline;
        }
        .app-content {
            margin-left: 240px;
            margin-top: 60px;
            padding: 40px 20px;
            transition: margin-left 0.3s ease;
        }
        body.sidebar-collapsed .app-sidebar {
            transform: translateX(-100%);
        }
        body.sidebar-collapsed .app-content {
            margin-left: 0;
        }
        .page-card {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.1);
            padding: 40px;
        }
        .doctor-row {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .doctor-row:last-child {
            margin-bottom: 0;
        }
        .doctor-name {
            font-weight: 700;
        }
        .doctor-specialty {
            color: #1B9AAA;
            font-size: 14px;
        }
        .rating {
            color: #f5a623;
            font-weight: 600;
        }
        .btn-teal {
            background-color: #1B9AAA;
            border-color: #1B9AAA;
            color: white;
        }
        .btn-teal:hover {
            background-color: #16808f;
            border-color: #16808f;
            color: white;
        }
    </style>
    <script src="{% static 'js/config.js' %}"></script>
</head>
<body>

    <header class="app-topbar">
        <button type="button" class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
        <span class="app-logo">DOCONNECT</span>
        <span class="app-page-title">Find a Doctor</span>
    </header>

    <nav class="app-sidebar" id="appSidebar">
        <div class="sidebar-links">
            <a href="{% url 'patient_profile' %}" class="sidebar-link">Profile</a>
            <a href="{% url 'patient_appointments' %}" class="sidebar-link">My Appointments</a>
            <a href="{% url 'browse_doctors' %}" class="sidebar-link active">Find a Doctor</a>
            <a href="{% url 'notifications' %}" class="sidebar-link">Notifications</a>
        </div>
        <div class="sidebar-footer">
            <button type="button" class="sidebar-logout" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="app-content">
<div class="page-card">
    <h1 class="h3 mb-4 text-center font-weight-normal">Find a Doctor</h1>

    <div class="mb-4">
        <select id="specialtyFilter" class="form-control">
            <option value="">All Specialties</option>
            <option value="general_practice">General Practice</option>
            <option value="pediatrics">Pediatrics</option>
            <option value="cardiology">Cardiology</option>
            <option value="dermatology">Dermatology</option>
            <option value="psychiatry">Psychiatry</option>
            <option value="orthopedics">Orthopedics</option>
            <option value="gynecology">Gynecology</option>
            <option value="dentistry">Dentistry</option>
            <option value="other">Other</option>
        </select>
    </div>

    <div class="text-center" id="loadingState">
        <p class="text-muted">Loading doctors...</p>
    </div>

    <div id="emptyState" class="text-center text-muted" style="display:none;">
        <p>No doctors found.</p>
    </div>

    <div id="errorState" class="text-center text-danger" style="display:none;">
        Could not load doctors. Please try again later.
    </div>

    <div id="doctorList"></div>
</div>
    </div>

<script>
    document.getElementById('sidebarToggle').addEventListener('click', function () {
        document.body.classList.toggle('sidebar-collapsed');
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('refreshToken');
        window.location.href = "{% url 'home' %}";
    });

    async function loadDoctors(specialty) {
        document.getElementById('loadingState').style.display = 'block';
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('errorState').style.display = 'none';
        document.getElementById('doctorList').innerHTML = '';

        try {
            let url = API_BASE_URL + '/api/doctors/doctors/';
            if (specialty) {
                url += `?specialty=${specialty}`;
            }

            const token = localStorage.getItem('accessToken');

            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error('Failed to fetch doctors');
            }

            const data = await response.json();
            document.getElementById('loadingState').style.display = 'none';

            const results = data.doctors || data.results || data;

            if (results.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
            } else {
                renderDoctors(results);
            }
        } catch (error) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            console.error(error);
        }
    }

    function renderDoctors(doctors) {
        const list = document.getElementById('doctorList');

        list.innerHTML = doctors.map(doc => `
        <div class="doctor-row">
            <div>
                <div class="doctor-name">Dr. ${doc.first_name} ${doc.last_name}</div>
                <div class="doctor-specialty">${doc.specialization || ''}</div>
            </div>
            <div class="text-end">
                <a href="/doctors/${doc.id}/" class="btn btn-teal btn-sm mt-1">View Profile</a>
            </div>
        </div>
        `).join('');
    }

    document.getElementById('specialtyFilter').addEventListener('change', function() {
        loadDoctors(this.value);
    });

    loadDoctors('');
</script>
</body>
</html>
